<script>/* Temporadas: Halloween hasta el 31 oct · Día de Muertos 1-2 nov · Revolución 16-20 nov · Navidad 14-27 dic 2026 · Año Nuevo 28 dic-3 ene · Aniversario del STIASRM 4-10 ene (fondo normal + tarjeta). Para ver una temporada como demostración: ?temporada=hw|dm|rv|nv|an|nm|aniv (nm = fondo normal) */(function(){var T=Date.now(),D=function(x){return Date.parse(x+'T00:00:00-06:00')},t='';if(T<D('2026-11-01'))t='hw';else if(T<D('2026-11-03'))t='dm';else if(T>=D('2026-11-16')&&T<D('2026-11-21'))t='rv';else if(T>=D('2026-12-14')&&T<D('2026-12-28'))t='nv';else if(T>=D('2026-12-28')&&T<D('2027-01-04'))t='an';var ani=T>=D('2027-01-04')&&T<D('2027-01-11');var q=/[?&]temporada=(hw|dm|rv|nv|an|nm|aniv)\b/.exec(location.search);if(q){t=q[1];ani=t==='aniv';if(ani)t='nm'}if(!t)t='nm';if(ani)document.documentElement.classList.add('aniv');if(t)document.documentElement.classList.add(t);if(t==='rv'||t==='nv'||t==='an'||t==='nm')document.addEventListener('DOMContentLoaded',function(){var m=document.querySelector('meta[name=theme-color][media*=dark]');if(m)m.content='#000000'})})()</script>

<style>
:root{
  --azul:#0068B8;--azul-h:#00579A;--azul-os:#003E6E;--azul-cl:#EEF5FC;--tx:#1F2430;--mu:#5B6575;--mu2:#8A94A3;
  --ln:#D3DAE3;--ln2:#E1E6ED;--ln3:#E6E9EE;--rojo:#E3202B;--amar:#FFE600;--verde:#1E8A3C;--verde-cl:#E9F5EC;--neg:#B4232C;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --flota:0 10px 28px rgba(0,58,110,.10),0 0 0 .5px rgba(0,58,110,.06);
  --vidrio-bg:rgba(255,255,255,.55);
  --navh:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior-y:contain;background:#FFFFFF;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(255,214,0,.8);outline-offset:2px;border-radius:12px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;isolation:isolate}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--ln3)}}

/* Fondo decorativo: caña y retrato */
.deco{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:380px;z-index:-1;pointer-events:none;overflow:hidden}
.deco svg,.deco img{position:absolute;bottom:0;display:block}
.deco .c1{left:-6px;opacity:.22}.deco .c2{left:78px;opacity:.16}
.deco img{right:-24px;height:340px;width:auto;opacity:.22}
body.en-chat .deco img{opacity:.12}

/* Franjas */
.franjas{display:flex;gap:5px}
.franjas i{display:block;width:22px;height:5px;border-radius:3px}
.franjas i:nth-child(1){background:var(--rojo)}.franjas i:nth-child(2){background:var(--amar)}.franjas i:nth-child(3){background:var(--azul)}.franjas i:nth-child(4){background:var(--verde)}
.franjas.g i{width:28px;height:6px}.franjas.g{gap:6px}

.scr{padding-top:var(--sat);padding-bottom:calc(var(--navh) + var(--sab) + 12px);min-height:100dvh}
#s-login{padding-bottom:calc(24px + var(--sab))}

/* Encabezados */
.top{display:flex;align-items:center;gap:8px;padding:14px 12px 0;min-height:68px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:700;min-width:0}
.top .tt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.top .tt h1{flex:none}
.top .tt span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.top .tt span::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--verde)}
.top img{height:44px;width:auto;display:block;margin-right:8px}
.volver,.ico-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--azul);cursor:pointer}
.volver:hover,.ico-btn:hover{background:#EEF4FB}
.top+.franjas{padding:10px 20px 0}
.pad{padding:20px 20px 0}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;padding:calc(64px + var(--sat)) 28px 0;min-height:100dvh}
.login-escudo{width:168px;height:auto;display:block}
.login .franjas{margin-top:28px}
.form{width:100%;display:flex;flex-direction:column;gap:18px;margin-top:40px}
.campo label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.caja{display:flex;align-items:center;gap:12px;height:56px;padding:0 6px 0 16px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.caja:focus-within{border-color:var(--azul);box-shadow:0 0 0 3px rgba(255,214,0,.55)}
.caja svg.ic{flex:none;color:var(--azul)}
.caja input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:17px;outline:none}
.caja input::placeholder{color:var(--mu2)}
/* el autollenado de iPhone/Chrome pinta el campo de amarillo: se deja el vidrio */
.caja input:-webkit-autofill,.caja input:-webkit-autofill:hover,.caja input:-webkit-autofill:focus,.caja input:-webkit-autofill:active{-webkit-text-fill-color:var(--tx);caret-color:var(--tx);-webkit-box-shadow:0 0 0 1000px transparent inset;box-shadow:0 0 0 1000px transparent inset;background-color:transparent!important;background-clip:text;-webkit-background-clip:text;transition:background-color 99999s ease-out 0s,color 99999s ease-out 0s}
.caja input:autofill{background-color:transparent!important;background-clip:text;-webkit-background-clip:text;box-shadow:0 0 0 1000px transparent inset;-webkit-text-fill-color:var(--tx);transition:background-color 99999s ease-out 0s}
#pin{letter-spacing:.2em}
#ojo .c{display:none}#ojo.on .c{display:block}#ojo.on .o{display:none}
#ojo{color:var(--mu)}
.olvide{align-self:flex-end;margin-top:-10px;background:none;border:0;color:var(--azul);font-weight:600;font-size:14px;padding:8px 2px;cursor:pointer;text-decoration:underline}
.hoja .campo{margin-bottom:12px;text-align:left}
.hoja .caja{padding-right:16px}
.hoja .err{min-height:18px;font-size:13.5px;color:var(--neg);text-align:center;margin-bottom:6px}
.hola{min-height:20px;font-size:14.5px;color:var(--azul);font-weight:600;margin-top:-6px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:-4px;font-size:15px;cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--azul);cursor:pointer}
.msg-err{min-height:20px;font-size:14px;color:var(--neg);text-align:center}
.btn-pri,.btn-sec,.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:14px;border:0;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;width:100%;transition:background .15s,transform .05s}
.btn-pri{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(0,104,184,.22)}.btn-pri:hover{background:var(--azul-h)}
#entrar{height:58px;font-size:18px}
.btn-pri:active,.btn-sec:active,.btn-wa:active{transform:translateY(1px)}
.btn-pri:disabled{opacity:.6;cursor:default}
.btn-sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}.btn-sec:hover{background:var(--azul-cl)}
.btn-wa{background:var(--verde);color:#fff;box-shadow:0 6px 16px rgba(30,138,60,.2)}.btn-wa:hover{background:#18742F}
.sm{height:46px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;cursor:pointer;padding:12px;margin-top:4px}
.tri{display:flex;width:120px;height:4px;border-radius:2px;overflow:hidden;margin:auto 0 8px}
.tri i{flex:1}.tri i:nth-child(1){background:var(--verde)}.tri i:nth-child(2){background:var(--ln3)}.tri i:nth-child(3){background:var(--rojo)}
.pie{padding:18px 0 14px;font-size:12.5px;color:var(--mu);text-align:center}

/* Inicio */
.home-top{position:relative;display:flex;align-items:center;justify-content:center;padding:28px 20px 0}
.home-top img{height:76px;width:auto;display:block}
.home-top #salir{position:absolute;right:12px;top:22px;color:var(--mu)}
.home-top+.franjas{justify-content:center;margin-top:12px}
.saludo{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:var(--azul-cl);box-shadow:var(--flota)}
.avatar{position:relative;flex:none;width:60px;height:60px;border-radius:50%;background:var(--azul);display:grid;place-items:center;border:0;padding:0;cursor:pointer}
.avatar img{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--azul)}
.avatar .cam{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,58,110,.25)}
.hoja-fondo{position:fixed;inset:0;z-index:40;background:rgba(15,25,40,.35);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:sube .22s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
.hoja .agarre{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.hoja h3{font-size:16px;text-align:center;margin-bottom:4px}
.hoja p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:12px}
.hoja .btns{display:flex;flex-direction:column;gap:10px}
.saludo .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.saludo small{font-size:15px}
.saludo h2{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.saludo p{font-size:13px;color:var(--mu);margin-top:2px}
.tarjetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border:1.5px solid var(--ln2);border-radius:18px;background:#fff;text-align:left;cursor:pointer;min-height:168px;box-shadow:var(--flota);transition:border-color .15s,box-shadow .15s,transform .15s}
.tarjeta:hover{border-color:var(--azul);box-shadow:0 12px 28px rgba(0,104,184,.16)}
.tarjeta:active{transform:translateY(1px)}
.tarjeta .fila1{display:flex;align-items:flex-start;justify-content:space-between}
.circ{width:56px;height:56px;border-radius:50%;background:var(--azul);display:grid;place-items:center;color:#fff}
.circ.v{background:var(--verde)}
.tarjeta .ch{color:var(--mu2);margin-top:4px}
.tarjeta b{font-size:17px;font-weight:700;line-height:1.25}
.tarjeta span.sub{font-size:13px;color:var(--mu);line-height:1.4}

/* Fondo de ahorro */
.saldo{display:flex;flex-direction:column;gap:10px;background:var(--azul);color:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 10px 24px rgba(0,104,184,.22)}
.saldo-lbl{font-size:16px;font-weight:800;color:#FFFFFF}
.saldo-amt{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.saldo-meta{font-size:15px;color:#E8F1FB;line-height:1.4}
.saldo-pill{align-self:flex-start;margin-top:4px;padding:8px 14px;border-radius:999px;background:var(--azul-os);font-size:14px;font-weight:600}
.saldo.vacio{background:#fff;color:var(--tx);border:1.5px solid var(--ln2);box-shadow:var(--flota)}
.saldo.vacio .saldo-lbl{color:var(--mu)}.saldo.vacio .saldo-meta{color:var(--mu)}
.saldo-sin{font-size:20px;font-weight:700}
.panel{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;padding:16px;box-shadow:var(--flota)}
.panel h2{font-size:15px;font-weight:700;margin-bottom:6px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln3)}
.fila:first-child{border-top:0}
.fila-l{display:flex;flex-direction:column;gap:2px}
.fila-t{font-size:14.5px;font-weight:600}
.fila-s{font-size:13px}.pos{color:var(--verde)}.neg{color:var(--neg)}
.fila-r{font-weight:700;font-variant-numeric:tabular-nums}
.cargando,.aviso{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;box-shadow:var(--flota)}
.cargando::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--ln2);border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Vidrio */
.vidrio{border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.65),rgba(255,255,255,.4));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.14),0 6px 20px rgba(0,58,110,.10)}

/* Desglose */
.sel-lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.sel{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 16px;border-radius:18px;transition:box-shadow .15s}
.sel:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 6px 20px rgba(0,58,110,.10)}
.sel svg{flex:none}
.sel select{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;outline:none}
.sel .flecha{position:absolute;right:14px;pointer-events:none}
.recibo{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;box-shadow:var(--flota)}
.recibo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:linear-gradient(180deg,rgba(238,245,252,.85),rgba(238,245,252,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -.5px 0 rgba(0,58,110,.10)}
.recibo-h b{font-size:15px}
.recibo-h span{font-size:12px;color:var(--mu)}
#recibo .cargando,#recibo .aviso{border:0;border-radius:0;box-shadow:none}
.rec-per{padding:10px 16px;font-size:13px;color:var(--mu);border-bottom:1px solid var(--ln3)}
.rec-lista{padding:0 16px}
.rec-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln3)}
.rec-fila:first-child{border-top:0}
.rec-l{display:flex;flex-direction:column;min-width:0}
.rec-c{font-size:14px;font-weight:600}
.rec-d{font-size:12.5px;color:var(--mu)}
.rec-m{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-tot{border-top:1px solid var(--ln2);padding:12px 16px;background:#FAFBFD}
.rec-tl{display:flex;justify-content:space-between;font-size:14.5px;padding:4px 0;font-variant-numeric:tabular-nums}
.rec-tl.neto{font-size:17px;font-weight:800;color:var(--azul);border-top:1px solid var(--ln2);margin-top:6px;padding-top:10px}
#descargar{margin-top:16px}

/* Préstamos */
.pre{--ac:var(--azul);--ac-cl:var(--azul-cl);background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:var(--flota)}
.pre.v{--ac:var(--verde);--ac-cl:var(--verde-cl)}
.pre-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ac-cl)}
.pre-h b{font-size:16px;flex:1;color:var(--ac)}
.pre-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--ac);border:1px solid var(--ac);white-space:nowrap}
.pre-m{padding:18px 16px 16px}
.pre-lbl{display:inline-block;font-size:14px;font-weight:800;color:#FFFFFF;background:var(--ac);padding:4px 12px;border-radius:999px}
.pre-amt{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ac)}
.pre-meta{font-size:13.5px;color:var(--mu);margin-top:4px}
.pre-ok{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--ac-cl);color:var(--ac);font-size:14.5px;font-weight:600}

/* Chat */
#s-chat{display:flex;flex-direction:column;height:100dvh;padding-bottom:0}
#s-chat[hidden]{display:none!important}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
.hoy{align-self:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.45);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.12),0 4px 12px rgba(0,58,110,.08);font-size:12px;font-weight:600;color:var(--mu)}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.msg.yo{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--azul-cl);display:grid;place-items:center;flex:none}
.msg-av img{height:22px;width:auto}
.msg-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg-b{background:var(--azul-cl);border-radius:18px 18px 18px 6px;padding:11px 14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.yo .msg-b{background:var(--azul);color:#fff;border-radius:18px 18px 6px 18px}
.msg-h{font-size:11px;color:var(--mu);padding:0 4px}
.yo .msg-h{text-align:right}
.msg-acc{display:flex;flex-direction:column;gap:10px;white-space:normal}
.msg:has(.ley){max-width:96%}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#A0A8B4;animation:pt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-pie{padding:6px 16px calc(var(--navh) + var(--sab) + 6px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.9),rgba(238,245,252,.6));box-shadow:0 0 0 .5px rgba(0,58,110,.16),0 4px 12px rgba(0,58,110,.08);color:var(--azul);font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{box-shadow:0 0 0 1px var(--azul),0 4px 12px rgba(0,58,110,.10)}
.chat-form{display:flex;align-items:center;gap:10px}

/* Consultas de ley */

/* Barra flotante de vidrio */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:calc(100% - 28px);max-width:452px;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 0 0 .5px rgba(0,58,110,.10),0 12px 36px rgba(0,58,110,.18)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:8px 2px 6px;border:0;background:none;border-radius:14px;min-height:58px;min-width:0;width:100%;cursor:pointer;color:var(--mu)}
.tab:hover{background:rgba(243,247,252,.8)}
.tab svg{width:24px;height:24px;flex:none}
.tab .tl{display:flex;align-items:flex-start;justify-content:center;height:24px;width:100%;font-size:10.5px;font-weight:500;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.tab .bar{display:block;width:36px;height:3px;border-radius:2px;background:transparent}

/* Transiciones y gestos */
@keyframes entraD{from{transform:translateX(28%);opacity:.3}to{transform:none;opacity:1}}
@keyframes entraI{from{transform:translateX(-28%);opacity:.3}to{transform:none;opacity:1}}
.entra-d{animation:entraD .26s cubic-bezier(.2,.8,.2,1)}

body.sinred .scr{padding-bottom:calc(var(--navh) + var(--sab) + 56px)}
#sinred{position:fixed;left:50%;bottom:calc(var(--navh) + var(--sab) + 14px);transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#8A4F00;background:rgba(255,244,229,.82);border:1px solid rgba(217,119,6,.35);backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:0 6px 18px rgba(0,0,0,.10);pointer-events:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--sab) + 18px);background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}

@keyframes latido{0%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%,100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Material de vidrio (mismo de la barra) en recuadros y menús ================= */

/* ================= Burbuja de vidrio en la barra ================= */
#nav{isolation:isolate;touch-action:none}
#nav .tab{position:relative;z-index:1;background:none!important;transition:color .25s}
#nav .tab:hover{background:none}
#nav .tab .bar{display:none}
#nav .tab svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#nav .tab.on svg{transform:scale(1.14)}
#nav .tab.cerca svg{transform:scale(1.24)}
#nav .tab.on.v{color:var(--verde)}
.burbuja{position:absolute;top:6px;bottom:6px;left:0;width:0;z-index:0;border-radius:24px;pointer-events:none;--tinte:0,104,184;
  background:linear-gradient(180deg,rgba(var(--tinte),.28),rgba(var(--tinte),.14));
  backdrop-filter:blur(6px) saturate(200%) brightness(1.08);-webkit-backdrop-filter:blur(6px) saturate(200%) brightness(1.08);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1.5px rgba(255,255,255,.45),inset 0 0 0 .5px rgba(var(--tinte),.35),0 6px 18px rgba(var(--tinte),.22),0 1px 3px rgba(0,0,0,.08);
  transition:transform .55s cubic-bezier(.25,1.45,.45,1),width .4s,background .45s,box-shadow .45s;transform-origin:center}
.burbuja::after{content:"";position:absolute;inset:2px 10% auto;height:42%;border-radius:20px 20px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.7}
.burbuja.v{--tinte:30,138,60}
.burbuja.arrastre{transition:background .3s,box-shadow .3s}

/* Android/Chrome: refracción real tipo lente */
html.lente .burbuja{z-index:2;background:linear-gradient(180deg,rgba(var(--tinte),.16),rgba(var(--tinte),.06));backdrop-filter:url(#lente) saturate(160%) brightness(1.05);-webkit-backdrop-filter:url(#lente) saturate(160%) brightness(1.05)}
@media (prefers-reduced-motion:reduce){.burbuja{transition:none}}

  background:var(--g-bg);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--g-borde);box-shadow:0 18px 50px rgba(0,30,70,.22),inset 0 1px 0 rgba(255,255,255,.45);
  transform-origin:90% 0;transform:scale(.92) translateY(-6px);opacity:0;transition:transform .22s cubic-bezier(.2,1.2,.4,1),opacity .18s}
.sem-menu.abierto{transform:none;opacity:1}
.sem-menu-t{padding:12px 16px 6px;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.sem-menu-l{overflow-y:auto;overscroll-behavior:contain;padding:0 6px 6px}
.sem-grupo{display:flex;align-items:center;gap:6px;padding:12px 12px 4px;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.sem-grupo.zafra{color:#1E8A3C}.sem-grupo.reparacion{color:#B45309}
.pre-ciclo{margin-bottom:8px}.pre-ciclo[hidden]{display:none}
.ciclo{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1}
.ciclo.zafra{background:rgba(46,158,75,.14);color:#1B7A35}
.ciclo.reparacion{background:rgba(217,119,6,.15);color:#9A5B00}
.ciclo.muerto{background:rgba(100,116,139,.16);color:#475569}
.sem-grupo.muerto{color:#64748B}
@media (prefers-color-scheme:dark){.ciclo.muerto{background:rgba(148,163,184,.2);color:#CBD5E1}.sem-grupo.muerto{color:#94A3B8}}
@media (prefers-color-scheme:dark){.ciclo.zafra{background:rgba(46,158,75,.22);color:#6FD48E}.ciclo.reparacion{background:rgba(217,119,6,.22);color:#FFB547}.sem-grupo.zafra{color:#6FD48E}.sem-grupo.reparacion{color:#FFB547}}
.sem-op{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:10px 12px;border-radius:12px;cursor:pointer}
.sem-op b{font-size:15px}
.sem-op span{grid-column:1;font-size:12.5px;color:var(--mu)}
.sem-op svg{grid-row:1/3;grid-column:2;color:var(--azul)}
.sem-op.on{background:rgba(0,104,184,.12)}
.sem-op.on b{color:var(--azul)}
.sem-op:active{background:rgba(0,104,184,.18)}
@media (prefers-color-scheme:dark){.sem-menu{box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}.sem-op.on{background:rgba(59,155,234,.2)}.sem-capa.abierto{background:rgba(0,0,0,.2)}}
.pre-amt.cambia{animation:semCambia .35s ease}
@keyframes semCambia{from{opacity:.2;transform:translateY(4px)}}
/* ================= Revolución Mexicana (solo con html.rv) ================= */
html.rv #splash{background:#000;overflow:hidden;transition:opacity .45s ease}
html.rv #splash.fuera{opacity:0}
html.rv #splash img.rv-fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:rvKen 9s ease-out forwards;filter:saturate(.9) brightness(.78)}
@keyframes rvKen{from{transform:scale(1.12)}to{transform:scale(1)}}
.rv-velo{position:absolute;inset:0;background:linear-gradient(180deg,#000 0,rgba(0,0,0,.55) 9%,transparent 22%),radial-gradient(55% 24% at 50% 37.5%,rgba(20,12,4,.72),rgba(20,12,4,.25) 70%,transparent),linear-gradient(0deg,rgba(15,9,3,.75),transparent 30%)}
html.rv #splash .sp-in{position:absolute;left:50%;top:37.5%;transform:translate(-50%,-50%);z-index:3}

html.rv #splash img.sp-esc{height:min(32vw,128px);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 20px rgba(255,214,140,.85)) drop-shadow(0 12px 26px rgba(0,0,0,.6))}
html.rv #splash .sp-barra{width:150px;background:rgba(255,255,255,.18)}
html.rv #splash .sp-barra i{background:linear-gradient(90deg,#006847 0 33%,#F4F1E8 33% 66%,#CE1126 66%);box-shadow:0 0 10px rgba(255,255,255,.35)}
.rv-luz{position:absolute;left:50%;top:37.5%;width:min(80vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.45) 0%,rgba(255,180,90,.18) 38%,transparent 70%);animation:dmLuz 1.15s ease-in-out infinite}
.rv-polvo{position:absolute;border-radius:50%;background:rgba(255,226,180,.55);filter:blur(1px);animation:rvPolvo linear infinite}
@keyframes rvPolvo{from{transform:translate(0,0);opacity:0}15%{opacity:1}to{transform:translate(var(--dx),-60vh);opacity:0}}
/* Inicio: guirnalda tricolor detrás del escudo */
.rv-guirnalda{position:absolute;left:0;right:0;top:0;height:58px;z-index:0;pointer-events:none}
.rv-guirnalda svg{width:100%;height:100%;display:block}
html.rv .home-top{padding-top:20px}
html.rv .home-top img{position:relative;z-index:1;filter:drop-shadow(0 0 10px rgba(255,200,120,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.2));animation:hwLat 2.4s ease-in-out infinite}
html.rv .home-top::before{content:"";position:absolute;left:50%;top:calc(50% + 10px);width:112px;height:112px;transform:translate(-50%,-50%);border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(255,210,140,.40),rgba(255,170,80,.12) 45%,transparent 70%);animation:hwLuna 2.4s ease-in-out infinite;pointer-events:none}
@media (prefers-color-scheme:dark){html.rv .home-top img{filter:drop-shadow(0 0 14px rgba(255,200,120,.7)) drop-shadow(0 6px 14px rgba(0,0,0,.25))}html.rv .home-top::before{width:150px;height:150px;background:radial-gradient(circle,rgba(255,215,150,.5),rgba(255,170,80,.16) 45%,transparent 70%)}}
/* tarjeta de temporada */
.rv-card{position:relative;overflow:hidden;margin-top:12px;border-radius:16px;padding:11px 110px 11px 14px;background:linear-gradient(110deg,rgba(0,104,71,.16),rgba(244,241,232,.10) 50%,rgba(206,17,38,.14));border:1px solid rgba(160,120,60,.35);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 8px 20px rgba(80,50,10,.12)}
.rv-card b{display:block;font-size:15.5px;color:#8A5A12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-card p{font-size:12.5px;color:var(--mu);margin-top:2px;line-height:1.3}
.rv-card img{position:absolute;right:0;top:0;height:100%;width:118px;object-fit:cover;object-position:40% 18%;filter:sepia(.2);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
@media (prefers-color-scheme:dark){.rv-card b{color:#E8C27A}}
html.rv #s-home .saludo{padding:14px}
html.rv #s-home .tarjetas{gap:12px;margin-top:12px}
html.rv #s-home .tarjeta{min-height:146px;gap:10px;padding:14px}
/* fondo de todas las pantallas: la escena completa a pantalla entera, con degradado (negro en modo oscuro, blanco en modo día) */
:is(html.rv,html.nv,html.an,html.nm){--fondo:#FFFFFF;--rv-velo:255,255,255}
@media (prefers-color-scheme:dark){:is(html.rv,html.nv,html.an,html.nm){--fondo:#000000;--rv-velo:0,0,0}}
:is(html.rv,html.nv,html.an,html.nm) .deco{top:0;bottom:0;height:auto;background:var(--fondo)}
:is(html.rv,html.nv,html.an,html.nm) .deco{max-width:none;width:100%}   /* el fondo ocupa toda la pantalla (iPad, Windows), no solo la columna */
:is(html.rv,html.nv,html.an,html.nm) .deco svg,:is(html.rv,html.nv,html.an,html.nm) .deco img:not(.rv-deco):not(.nm-deco){display:none}
.deco video:is(.nv-deco,.an-deco){position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
:is(html.rv,html.nv,html.an,html.nm) .deco :is(.rv-deco,.nv-deco,.an-deco,.nm-deco){display:block;position:absolute;inset:0;left:0;right:0;transform:none;width:100%;height:100%;object-fit:cover;object-position:50% 62%;opacity:1!important;filter:sepia(.35) saturate(.8)!important;-webkit-mask-image:none;mask-image:none}
:is(html.rv,html.nv,html.an,html.nm) .deco::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--rv-velo),1) 0%,rgba(var(--rv-velo),.94) 16%,rgba(var(--rv-velo),.82) 48%,rgba(var(--rv-velo),.62) 100%)}
@media (prefers-color-scheme:dark){:is(html.rv,html.nv,html.an,html.nm) .deco::after{background:linear-gradient(180deg,rgba(var(--rv-velo),1) 0%,rgba(var(--rv-velo),.9) 16%,rgba(var(--rv-velo),.72) 48%,rgba(var(--rv-velo),.48) 100%)}}
html.nv .deco .nv-deco{filter:none!important;object-position:50% 50%}
/* recuadros: todos con la misma transparencia (inicio y dentro de cada opción); el confeti se ve por detrás con blur suave */
:is(html.rv,html.nv,html.an,html.nm){--rv-caja:rgba(255,255,255,.40);--rv-blur:blur(8px) saturate(170%)}
@media (prefers-color-scheme:dark){:is(html.rv,html.nv,html.an,html.nm){--rv-caja:rgba(10,10,12,.40)}}
:is(html.rv,html.nv,html.an,html.nm) :is(.tarjeta,.panel,.recibo,.pre,.cargando,.aviso,.ley,.pasos,.saldo.vacio,.saludo,.vidrio){background:var(--rv-caja);backdrop-filter:var(--rv-blur);-webkit-backdrop-filter:var(--rv-blur)}
:is(html.rv,html.nv,html.an,html.nm) .rv-card{backdrop-filter:var(--rv-blur);-webkit-backdrop-filter:var(--rv-blur)}
:is(html.rv,html.nv,html.an,html.nm) .recibo-h{background:linear-gradient(180deg,rgba(0,104,184,.12),rgba(0,104,184,.05))}
:is(html.rv,html.nv,html.an,html.nm) .rec-tot{background:rgba(255,255,255,.18)}
@media (prefers-color-scheme:dark){:is(html.rv,html.nv,html.an,html.nm) .recibo-h{background:linear-gradient(180deg,rgba(59,155,234,.18),rgba(59,155,234,.07))}:is(html.rv,html.nv,html.an,html.nm) .rec-tot{background:rgba(0,0,0,.18)}}
html.seguro.rv{--rv-caja:var(--g-bg)}
/* tarjeta de temporada que se puede tocar y su resumen */
.temp-toca{cursor:pointer;transition:transform .15s}
.temp-toca:active{transform:scale(.98)}
.hoja .temp-info{max-height:55vh;overflow:auto;margin:4px 2px 14px;display:flex;flex-direction:column;gap:10px}
.hoja .temp-info p{font-size:15px;line-height:1.45;color:var(--tx);text-align:left;margin:0}
/* hojas y menús: el mismo vidrio negro (noche) / blanco (día) que los recuadros */
:is(html.rv,html.nv,html.an,html.nm) :is(.hoja,.sem-menu){background:var(--rv-caja);backdrop-filter:var(--rv-blur);-webkit-backdrop-filter:var(--rv-blur);border-color:var(--g-borde)}
:is(html.rv,html.nv,html.an,html.nm) .hoja-fondo{background:rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:is(html.rv,html.nv,html.an,html.nm) .hoja-fondo{background:rgba(0,0,0,.35)}}
/* confeti tricolor que cae por detrás */
.rv-confeti{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.rv-pz{position:absolute;top:-20px;border-radius:2px;animation:rvCae linear infinite}
@keyframes rvCae{0%{transform:translate(0,0) rotate(0) rotateY(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r)) rotateY(720deg)}}
@media (prefers-reduced-motion:reduce){.rv-confeti,.rv-polvo{display:none}html.rv #splash img.rv-fondo{animation:none}}

.firma{font-family:"Firma S80",cursive;font-weight:400;line-height:1.2;letter-spacing:.2px;white-space:nowrap;pointer-events:none}
#splash .firma{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);text-align:center;z-index:4;font-size:15px;color:rgba(255,255,255,.62);text-shadow:0 1px 6px rgba(0,0,0,.45)}
html:not(.hw):not(.dm):not(.rv):not(.nv):not(.an) #splash .firma{color:rgba(31,36,48,.45);text-shadow:none}
@media (prefers-color-scheme:dark){html:not(.hw):not(.dm):not(.rv):not(.nv):not(.an) #splash .firma{color:rgba(236,222,176,.5)}}
/* ================= Fondo normal (sin temporada): retrato con degradado y escudos que caen ================= */
html.nm .deco .nm-deco{top:auto!important;bottom:-14%;height:80%!important;object-fit:contain;object-position:50% 100%;filter:none!important}
html.nm .deco .nm-deco.oscuro{display:none!important}
@media (prefers-color-scheme:dark){html.nm .deco .nm-deco.claro{display:none!important}html.nm .deco .nm-deco.oscuro{display:block!important}}
/* iPad y pantallas anchas: el retrato difuminado llena los lados y la foto se funde con él (sin bordes negros) */
html.nm .deco .nm-deco.amb{top:-8%!important;bottom:auto;left:-8%;width:116%!important;height:116%!important;object-fit:cover;object-position:50% 45%;filter:blur(70px) saturate(1.15)!important;opacity:.8!important}
@media (min-aspect-ratio:1/2){html.nm .deco .nm-deco:not(.amb){width:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;-webkit-mask-image:linear-gradient(90deg,transparent,#000 34%,#000 66%,transparent),linear-gradient(180deg,transparent,#000 18%)!important;-webkit-mask-composite:source-in!important;mask-image:linear-gradient(90deg,transparent,#000 34%,#000 66%,transparent),linear-gradient(180deg,transparent,#000 18%)!important;mask-composite:intersect!important}}
html.nm .deco::after{background:linear-gradient(180deg,rgba(var(--rv-velo),1) 0%,rgba(var(--rv-velo),1) 24%,rgba(var(--rv-velo),.80) 40%,rgba(var(--rv-velo),.62) 62%,rgba(var(--rv-velo),.74) 100%)}
@media (prefers-color-scheme:dark){html.nm .deco::after{background:linear-gradient(180deg,rgba(var(--rv-velo),1) 0%,rgba(var(--rv-velo),1) 24%,rgba(var(--rv-velo),.70) 40%,rgba(var(--rv-velo),.44) 62%,rgba(var(--rv-velo),.62) 100%)}}
.nm-lluvia{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.nm-esc{position:absolute;top:-60px;height:auto;animation:nmCae linear infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
@keyframes nmCae{0%{transform:translate(0,0) rotate(var(--r0))}100%{transform:translate(var(--dx),calc(100vh + 120px)) rotate(var(--r1))}}
@media (prefers-reduced-motion:reduce){.nm-lluvia{display:none}}
/* ================= Inicio en una sola pantalla: se compacta por pasos si no cabe (sobre todo con tarjeta de temporada) ================= */
html.fit1 #s-home .tarjetas{gap:10px;margin-top:12px}
html.fit1 #s-home .tarjetas .tarjeta{min-height:0;padding:13px;gap:8px}
html.fit1 #s-home .tarjeta .circ{width:46px;height:46px}
html.fit1 #s-home .tarjeta .circ svg{width:24px;height:24px}
html.fit1 #s-home .tarjeta b{font-size:16px}
html.fit1 #s-home .tarjeta span.sub{font-size:12.5px;line-height:1.35}
html.fit2 #s-home .home-top{padding-top:12px}
html.fit2 #s-home .home-top img:not(.nv-guirnalda){height:60px}
html.fit2 #s-home .home-top+.franjas{margin-top:8px}
html.fit2 #s-home .pad{padding-top:12px}
html.fit2 #s-home .saludo{padding:11px 14px;gap:12px}
html.fit2 #s-home .avatar,html.fit2 #s-home .avatar img{width:50px;height:50px}

<script>
const ITER = 210000;
const normPin = s => String(s || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
const $ = s => document.querySelector(s);

const te = new TextEncoder(), td = new TextDecoder();
const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
const pdate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fdate = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? pdate(s).toLocaleDateString('es-MX', o) : '—';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// Número corto (el que usan los trabajadores) ↔ número de nómina: 8 ↔ 10008, 1003 ↔ 11003, 5001 ↔ 15001
const normSocio = s => { const v = String(s || '').trim().replace(/\s+/g, '').toUpperCase(); return /^\d{1,4}$/.test(v) ? '1' + v.padStart(4, '0') : v; };
const corto = s => /^1\d{4}$/.test(String(s)) ? (String(s).slice(1).replace(/^0+/, '') || '0') : String(s);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function cuentaId(socio) { return hex(await crypto.subtle.digest('SHA-256', te.encode('fondo-id:v1:' + normSocio(socio)))).slice(0, 40); }
async function deriveKey(socio, pin, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(normSocio(socio) + ':' + pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(socio, pin, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(socio, pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct)) };
}
async function unseal(socio, pin, d) {
  const key = await deriveKey(socio, pin, unb64(d.s), d.n || 210000);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.i) }, key, unb64(d.c));
  unseal.key = key;
  return JSON.parse(td.decode(pt));
}


async function buildDesglose(D) {
  await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const doc = await PDFDocument.create();
  const W = 792, H = 612; const page = doc.addPage([W, H]);
  const R = await doc.embedFont(StandardFonts.Helvetica), B = await doc.embedFont(StandardFonts.HelveticaBold);

  ps.forEach((p, i) => { let s = 0; tokens(p).forEach(w => { if (qs && qs.has(raiz(w))) s++; }); if (s > bs) { bs = s; best = i; } });
  let out = [], len = 0, i = qs ? best : 0;
  if (i > 0 && ps[0].length < 260) { out.push(ps[0]); len += ps[0].length; if (i > 1) out.push('…'); }
  for (; i < ps.length && len < max; i++) { out.push(ps[i]); len += ps[i].length; }
  let txt = out.join('\n');
  if (txt.length > max + 200) txt = txt.slice(0, max + 150).replace(/\s+\S*$/, '') + '…';
  return { txt, corto: true };
}
function tarjetaArt(i, qs) {

    c.append(b);

}

async function responderLey(text) {
  const t = escribiendo();
  try { await cargarLeyes(); } catch (e) { t.remove(); bot('No pude abrir los libros de consulta. Revisa tu conexión a internet e inténtalo de nuevo.'); return true; }
  t.remove();
  const q = sinAcento(text);
  // Tabulador de salarios
  if (/(cuanto gana|cuanto ganan|salario de|sueldo de|tabulador|tarifa de|cuanto pagan)/.test(q)) {
    const rows = buscarTabulador(text);
    if (rows.length) {
      const box = el('div', 'msg-acc');
      box.append(el('div', null, 'Esto marca el tabulador de salarios diarios del Contrato Ley:'));
      rows.forEach(r => {
        const c = el('div', 'ley');
        c.append(el('div', 'ley-t', `${r[0]} · ${titulo(r[1])}`));
        c.append(el('div', 'ley-x', `Ingenios de más de 40 mil tons.: ${r[2]}\nDe 20 a 40 mil tons.: ${r[3]}\nMenos de 20 mil tons.: ${r[4]}`));
        box.append(c);
      });
      box.append(el('div', 'ley-nota', 'Tabulador vigente del 16 de octubre de 2024 al 15 de octubre de 2025, antes de los aumentos posteriores. Confirma la cifra actual con la Secretaría de Relaciones.'), botonSecretario('con una duda sobre el tabulador de salarios'));
      bot(box); return true;
    }
  }
  // Artículo específico
  const art = buscarArticulo(text);
  if (art) {
    if (!art.list.length) { bot(`No encontré el artículo ${art.num} en los libros que tengo (Ley Federal del Trabajo, Contrato Ley, Ley del ISR y su Reglamento).`); return true; }
    if (art.exact || art.list.length === 1) {
      const box = el('div', 'msg-acc'); box.append(tarjetaArt(art.list[0], null), el('div', 'ley-nota', NOTA_LEY), botonSecretario('con una duda sobre la ley o el Contrato Ley')); bot(box); return true;
    }
    const box = el('div', 'msg-acc');
    box.append(el('div', null, `El artículo ${art.num} aparece en varios libros. ¿Cuál quieres ver?`));
    const row = el('div', 'ley-ops');
    art.list.forEach(i => {
      const b = el('button', 'chip', NOMBRE_DOC(LEY.data.a[i][0])); b.type = 'button';
      b.onclick = () => { yo(`Artículo ${art.num} · ${NOMBRE_DOC(LEY.data.a[i][0])}`); const bx = el('div', 'msg-acc'); bx.append(tarjetaArt(i, null), el('div', 'ley-nota', NOTA_LEY), botonSecretario('con una duda sobre la ley o el Contrato Ley')); bot(bx); };
      row.append(b);
    });
    box.append(row); bot(box); return true;
  }
  // Respuesta en primera persona si es una duda frecuente
  const fq = buscarFAQ(text);
  if (fq) { responderFAQ(fq); return true; }
  // Búsqueda por tema
  const r = buscarLey(text);
  if (!r.length || r[0].s < 3.2) return false;
  const box = el('div', 'msg-acc');
  const doc = LEY.data.a[r[0].i][0];
  box.append(el('div', null, `Te comparto lo que dice ${doc === 'CL' || doc === 'RISR' ? 'el' : 'la'} ${NOMBRE_DOC(doc)} sobre lo que me preguntas:`));
  box.append(tarjetaArt(r[0].i, r[0].q));
  const otros = r.slice(1).filter(x => x.s > r[0].s * 0.55).slice(0, 3);
  if (otros.length) {
    box.append(el('div', 'ley-sub', 'También puede servirte:'));
    const row = el('div', 'ley-ops');
    otros.forEach(x => {
      const a = LEY.data.a[x.i];
      const b = el('button', 'chip', `${a[0] === 'CL' ? 'Contrato Ley' : a[0] === 'LFT' ? 'LFT' : a[0] === 'LISR' ? 'Ley ISR' : 'Reglamento ISR'} · Art. ${a[1].split(',')[0]}`); b.type = 'button';
      b.onclick = () => { const bx = el('div', 'msg-acc'); bx.append(tarjetaArt(x.i, x.q)); bot(bx); };
      row.append(b);
    });
    box.append(row);
  }
  box.append(el('div', 'ley-nota', NOTA_LEY), botonSecretario('con una duda sobre la ley o el Contrato Ley'));
  bot(box);
  return true;
}

/* ================= Lente (refracción) en Android / Chrome ================= */
// Chip gráfico: los Adreno (Honor X9c, Poco X6…) se bloquean con la refracción SVG del cristal
const GPU = (() => { try { const g = document.createElement('canvas').getContext('webgl'); const x = g && g.getExtension('WEBGL_debug_renderer_info'); return x ? String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)) : ''; } catch (e) { return ''; } })();
const MODO_SEGURO = document.documentElement.classList.contains('seguro');
// Refracción SVG apagada en todos: en varios Android (Honor X9c, Poco X6, Galaxy Note 20) dejaba la pantalla sin dibujar
const LENTE_OK = false && (() => { const ua = navigator.userAgent || ''; return /Chrome\/\d+/.test(ua) && !/iPhone|iPad|iPod|CriOS|Edg\//.test(ua) && !/adreno/i.test(GPU) && !MODO_SEGURO && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); })();
if (LENTE_OK) document.documentElement.classList.add('lente');
let lenteTam = '';
function ajustarLente(w, h) {
  if (!LENTE_OK || !w || !h) return;
  w = Math.round(w); h = Math.round(h);
  const clave = w + 'x' + h; if (clave === lenteTam) return; lenteTam = clave;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), img = x.createImageData(w, h), r = Math.min(24, h / 2), banda = Math.min(13, h / 3);
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    // distancia al borde del rectángulo redondeado y dirección hacia el centro
    const cx = Math.min(Math.max(px, r), w - r), cy = Math.min(Math.max(py, r), h - r);
    let dx = px - cx, dy = py - cy, dist;
    if (dx || dy) { const l = Math.hypot(dx, dy); dist = r - l; dx /= l; dy /= l; }
    else { const izq = px, der = w - 1 - px, arr = py, aba = h - 1 - py; dist = Math.min(izq, der, arr, aba);
      dx = dist === izq ? -1 : dist === der ? 1 : 0; dy = dx ? 0 : (dist === arr ? -1 : 1); }
    const t = Math.max(0, Math.min(1, dist / banda)), f = (1 - t) * (1 - t);
    const i = (py * w + px) * 4;
    img.data[i] = 128 - dx * f * 127; img.data[i + 1] = 128 - dy * f * 127; img.data[i + 2] = 128; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const f = $('#lente'), m = $('#lente-mapa');
  f.setAttribute('width', w); f.setAttribute('height', h);
  m.setAttribute('width', w); m.setAttribute('height', h);
  m.setAttribute('href', c.toDataURL());
}

// Nombre completo siempre empezando por el nombre: la nómina trae «APELLIDO APELLIDO NOMBRES» (respeta «de la», «del»…)
function nombrePrimero(raw) {
  const P = new Set(['DE', 'DEL', 'LA', 'LAS', 'LOS', 'Y', 'SAN', 'SANTA', 'MC', 'VDA', 'VIUDA']); let u = [], a = [];
  for (const w of String(raw || '').trim().split(/\s+/).filter(Boolean)) { a.push(w); if (!P.has(w.toUpperCase())) { u.push(a.join(' ')); a = []; } }
  if (a.length) { if (u.length) u[u.length - 1] += ' ' + a.join(' '); else u.push(a.join(' ')); }
  if (u.length >= 3) u = u.slice(2).concat(u.slice(0, 2)); else if (u.length === 2) u = [u[1], u[0]];
  return u.join(' ').split(' ').map((x, i) => P.has(x.toUpperCase()) && i ? x.toLowerCase() : x.charAt(0).toUpperCase() + x.slice(1).toLowerCase()).join(' ');
}
function nombreCompleto(d) { return d.orden === 'nomina' ? nombrePrimero(d.nombreNomina || d.nombre) : titulo(d.nombre || ''); }
function primerNombre(d) {
  const b = DATA && session && DATA.cuentas[session.id];
  if (b && b.nm) return titulo(b.nm);
  return d.orden === 'nomina' ? '' : titulo((d.nombre || '').split(' ')[0]);
}
// Saludo: primer nombre y primer apellido ("Edgar Eduardo Molina Macias" -> "Edgar Molina"); respeta "de la", "del", etc.
function nombreCorto(nombre, orden) {
  const P = new Set(['DE', 'DEL', 'LA', 'LAS', 'LOS', 'Y', 'SAN', 'SANTA', 'MC', 'VDA', 'VIUDA']);
  const t = String(nombre || '').trim().toUpperCase().split(/\s+/).filter(Boolean), u = []; let a = [];
  for (const w of t) { a.push(w); if (!P.has(w)) { u.push(a.join(' ')); a = []; } }
  if (a.length) { if (u.length) u[u.length - 1] += ' ' + a.join(' '); else u.push(a.join(' ')); }
  if (!u.length) return '';
  const r = u.length === 1 ? [u[0]] : orden === 'nomina' ? [u[2] || u[1], u[0]] : [u[0], u.length === 2 ? u[1] : u[u.length - 2]];
  return r.join(' ').toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase()).replace(/\b(De|Del|La|Las|Los|Y)\b(?=\s)/g, m => m.toLowerCase());
}
