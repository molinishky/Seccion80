<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Halloween: hasta el último minuto del 31 de octubre de 2026 */if(Date.now()<Date.parse('2026-11-01T00:00:00-06:00'))document.documentElement.classList.add('hw');/* Día de Muertos: 1 y 2 de noviembre */else if(Date.now()<Date.parse('2026-11-03T00:00:00-06:00'))document.documentElement.classList.add('dm')</script>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sección 80">
<title>Sección 80</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0068B8;--azul-h:#00579A;--azul-os:#003E6E;--azul-cl:#EEF5FC;--tx:#1F2430;--mu:#5B6575;--mu2:#8A94A3;
  --ln:#D3DAE3;--ln2:#E1E6ED;--ln3:#E6E9EE;--rojo:#E3202B;--amar:#FFE600;--verde:#1E8A3C;--verde-cl:#E9F5EC;--neg:#B4232C;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --flota:0 10px 28px rgba(0,58,110,.10),0 0 0 .5px rgba(0,58,110,.06);
  --vidrio-bg:rgba(255,255,255,.55);
  --navh:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior-y:contain;background:#FFFFFF;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(255,214,0,.8);outline-offset:2px;border-radius:12px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;isolation:isolate}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--ln3)}}

/* Fondo decorativo: caña y retrato */
.deco{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:380px;z-index:-1;pointer-events:none;overflow:hidden}
.deco svg,.deco img{position:absolute;bottom:0;display:block}
.deco .c1{left:-6px;opacity:.22}.deco .c2{left:78px;opacity:.16}
.deco img{right:-24px;height:340px;width:auto;opacity:.22}
body.en-chat .deco img{opacity:.12}

/* Franjas */
.franjas{display:flex;gap:5px}
.franjas i{display:block;width:22px;height:5px;border-radius:3px}
.franjas i:nth-child(1){background:var(--rojo)}.franjas i:nth-child(2){background:var(--amar)}.franjas i:nth-child(3){background:var(--azul)}.franjas i:nth-child(4){background:var(--verde)}
.franjas.g i{width:28px;height:6px}.franjas.g{gap:6px}

.scr{padding-top:var(--sat);padding-bottom:calc(var(--navh) + var(--sab) + 12px);min-height:100dvh}
#s-login{padding-bottom:calc(24px + var(--sab))}

/* Encabezados */
.top{display:flex;align-items:center;gap:8px;padding:14px 12px 0;min-height:68px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:700;min-width:0}
.top .tt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.top .tt h1{flex:none}
.top .tt span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.top .tt span::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--verde)}
.top img{height:44px;width:auto;display:block;margin-right:8px}
.volver,.ico-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--azul);cursor:pointer}
.volver:hover,.ico-btn:hover{background:#EEF4FB}
.top+.franjas{padding:10px 20px 0}
.pad{padding:20px 20px 0}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;padding:calc(64px + var(--sat)) 28px 0;min-height:100dvh}
.login-escudo{width:168px;height:auto;display:block}
.login .franjas{margin-top:28px}
.form{width:100%;display:flex;flex-direction:column;gap:18px;margin-top:40px}
.campo label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.caja{display:flex;align-items:center;gap:12px;height:56px;padding:0 6px 0 16px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.caja:focus-within{border-color:var(--azul);box-shadow:0 0 0 3px rgba(255,214,0,.55)}
.caja svg.ic{flex:none;color:var(--azul)}
.caja input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:17px;outline:none}
.caja input::placeholder{color:var(--mu2)}
#pin{letter-spacing:.2em}
#ojo .c{display:none}#ojo.on .c{display:block}#ojo.on .o{display:none}
#ojo{color:var(--mu)}
.olvide{align-self:flex-end;margin-top:-10px;background:none;border:0;color:var(--azul);font-weight:600;font-size:14px;padding:8px 2px;cursor:pointer;text-decoration:underline}
.hoja .campo{margin-bottom:12px;text-align:left}
.hoja .caja{padding-right:16px}
.hoja .err{min-height:18px;font-size:13.5px;color:var(--neg);text-align:center;margin-bottom:6px}
.hola{min-height:20px;font-size:14.5px;color:var(--azul);font-weight:600;margin-top:-6px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:-4px;font-size:15px;cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--azul);cursor:pointer}
.msg-err{min-height:20px;font-size:14px;color:var(--neg);text-align:center}
.btn-pri,.btn-sec,.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:14px;border:0;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;width:100%;transition:background .15s,transform .05s}
.btn-pri{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(0,104,184,.22)}.btn-pri:hover{background:var(--azul-h)}
#entrar{height:58px;font-size:18px}
.btn-pri:active,.btn-sec:active,.btn-wa:active{transform:translateY(1px)}
.btn-pri:disabled{opacity:.6;cursor:default}
.btn-sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}.btn-sec:hover{background:var(--azul-cl)}
.btn-wa{background:var(--verde);color:#fff;box-shadow:0 6px 16px rgba(30,138,60,.2)}.btn-wa:hover{background:#18742F}
.sm{height:46px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;cursor:pointer;padding:12px;margin-top:4px}
.tri{display:flex;width:120px;height:4px;border-radius:2px;overflow:hidden;margin:auto 0 8px}
.tri i{flex:1}.tri i:nth-child(1){background:var(--verde)}.tri i:nth-child(2){background:var(--ln3)}.tri i:nth-child(3){background:var(--rojo)}
.pie{padding:18px 0 14px;font-size:12.5px;color:var(--mu);text-align:center}

/* Inicio */
.home-top{position:relative;display:flex;align-items:center;justify-content:center;padding:28px 20px 0}
.home-top img{height:76px;width:auto;display:block}
.home-top #salir{position:absolute;right:12px;top:22px;color:var(--mu)}
.home-top+.franjas{justify-content:center;margin-top:12px}
.saludo{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:var(--azul-cl);box-shadow:var(--flota)}
.avatar{position:relative;flex:none;width:60px;height:60px;border-radius:50%;background:var(--azul);display:grid;place-items:center;border:0;padding:0;cursor:pointer}
.avatar img{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--azul)}
.avatar .cam{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,58,110,.25)}
.hoja-fondo{position:fixed;inset:0;z-index:40;background:rgba(15,25,40,.35);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:sube .22s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
.hoja .agarre{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.hoja h3{font-size:16px;text-align:center;margin-bottom:4px}
.hoja p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:12px}
.hoja .btns{display:flex;flex-direction:column;gap:10px}
.saludo .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.saludo small{font-size:15px}
.saludo h2{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.saludo p{font-size:13px;color:var(--mu);margin-top:2px}
.tarjetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border:1.5px solid var(--ln2);border-radius:18px;background:#fff;text-align:left;cursor:pointer;min-height:168px;box-shadow:var(--flota);transition:border-color .15s,box-shadow .15s,transform .15s}
.tarjeta:hover{border-color:var(--azul);box-shadow:0 12px 28px rgba(0,104,184,.16)}
.tarjeta:active{transform:translateY(1px)}
.tarjeta .fila1{display:flex;align-items:flex-start;justify-content:space-between}
.circ{width:56px;height:56px;border-radius:50%;background:var(--azul);display:grid;place-items:center;color:#fff}
.circ.v{background:var(--verde)}
.tarjeta .ch{color:var(--mu2);margin-top:4px}
.tarjeta b{font-size:17px;font-weight:700;line-height:1.25}
.tarjeta span.sub{font-size:13px;color:var(--mu);line-height:1.4}

/* Fondo de ahorro */
.saldo{display:flex;flex-direction:column;gap:10px;background:var(--azul);color:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 10px 24px rgba(0,104,184,.22)}
.saldo-lbl{font-size:16px;font-weight:800;color:#FFFFFF}
.saldo-amt{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.saldo-meta{font-size:15px;color:#E8F1FB;line-height:1.4}
.saldo-pill{align-self:flex-start;margin-top:4px;padding:8px 14px;border-radius:999px;background:var(--azul-os);font-size:14px;font-weight:600}
.saldo.vacio{background:#fff;color:var(--tx);border:1.5px solid var(--ln2);box-shadow:var(--flota)}
.saldo.vacio .saldo-lbl{color:var(--mu)}.saldo.vacio .saldo-meta{color:var(--mu)}
.saldo-sin{font-size:20px;font-weight:700}
.panel{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;padding:16px;box-shadow:var(--flota)}
.panel h2{font-size:15px;font-weight:700;margin-bottom:6px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln3)}
.fila:first-child{border-top:0}
.fila-l{display:flex;flex-direction:column;gap:2px}
.fila-t{font-size:14.5px;font-weight:600}
.fila-s{font-size:13px}.pos{color:var(--verde)}.neg{color:var(--neg)}
.fila-r{font-weight:700;font-variant-numeric:tabular-nums}
.cargando,.aviso{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;box-shadow:var(--flota)}
.cargando::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--ln2);border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Vidrio */
.vidrio{border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.65),rgba(255,255,255,.4));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.14),0 6px 20px rgba(0,58,110,.10)}

/* Desglose */
.sel-lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.sel{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 16px;border-radius:18px;transition:box-shadow .15s}
.sel:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 6px 20px rgba(0,58,110,.10)}
.sel svg{flex:none}
.sel select{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;outline:none}
.sel .flecha{position:absolute;right:14px;pointer-events:none}
.recibo{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;box-shadow:var(--flota)}
.recibo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:linear-gradient(180deg,rgba(238,245,252,.85),rgba(238,245,252,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -.5px 0 rgba(0,58,110,.10)}
.recibo-h b{font-size:15px}
.recibo-h span{font-size:12px;color:var(--mu)}
#recibo .cargando,#recibo .aviso{border:0;border-radius:0;box-shadow:none}
.rec-per{padding:10px 16px;font-size:13px;color:var(--mu);border-bottom:1px solid var(--ln3)}
.rec-lista{padding:0 16px}
.rec-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln3)}
.rec-fila:first-child{border-top:0}
.rec-l{display:flex;flex-direction:column;min-width:0}
.rec-c{font-size:14px;font-weight:600}
.rec-d{font-size:12.5px;color:var(--mu)}
.rec-m{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-tot{border-top:1px solid var(--ln2);padding:12px 16px;background:#FAFBFD}
.rec-tl{display:flex;justify-content:space-between;font-size:14.5px;padding:4px 0;font-variant-numeric:tabular-nums}
.rec-tl.neto{font-size:17px;font-weight:800;color:var(--azul);border-top:1px solid var(--ln2);margin-top:6px;padding-top:10px}
#descargar{margin-top:16px}

/* Préstamos */
.pre{--ac:var(--azul);--ac-cl:var(--azul-cl);background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:var(--flota)}
.pre.v{--ac:var(--verde);--ac-cl:var(--verde-cl)}
.pre-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ac-cl)}
.pre-h b{font-size:16px;flex:1;color:var(--ac)}
.pre-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--ac);border:1px solid var(--ac);white-space:nowrap}
.pre-m{padding:18px 16px 16px}
.pre-lbl{display:inline-block;font-size:14px;font-weight:800;color:#FFFFFF;background:var(--ac);padding:4px 12px;border-radius:999px}
.pre-amt{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ac)}
.pre-meta{font-size:13.5px;color:var(--mu);margin-top:4px}
.pre-ok{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--ac-cl);color:var(--ac);font-size:14.5px;font-weight:600}

/* Chat */
#s-chat{display:flex;flex-direction:column;height:100dvh;padding-bottom:0}
#s-chat[hidden]{display:none!important}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
.hoy{align-self:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.45);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.12),0 4px 12px rgba(0,58,110,.08);font-size:12px;font-weight:600;color:var(--mu)}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.msg.yo{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--azul-cl);display:grid;place-items:center;flex:none}
.msg-av img{height:22px;width:auto}
.msg-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg-b{background:var(--azul-cl);border-radius:18px 18px 18px 6px;padding:11px 14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.yo .msg-b{background:var(--azul);color:#fff;border-radius:18px 18px 6px 18px}
.msg-h{font-size:11px;color:var(--mu);padding:0 4px}
.yo .msg-h{text-align:right}
.msg-acc{display:flex;flex-direction:column;gap:10px;white-space:normal}
.msg:has(.ley){max-width:96%}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#A0A8B4;animation:pt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-pie{padding:6px 16px calc(var(--navh) + var(--sab) + 6px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.9),rgba(238,245,252,.6));box-shadow:0 0 0 .5px rgba(0,58,110,.16),0 4px 12px rgba(0,58,110,.08);color:var(--azul);font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{box-shadow:0 0 0 1px var(--azul),0 4px 12px rgba(0,58,110,.10)}
.chat-form{display:flex;align-items:center;gap:10px}
.chat-form .entrada{flex:1;display:flex;align-items:center;height:48px;padding:0 16px;border-radius:24px}
.chat-form .entrada:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 6px 20px rgba(0,58,110,.10)}
.chat-form input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;outline:none}
.chat-form input::placeholder{color:var(--mu2)}
.enviar{width:48px;height:48px;border-radius:50%;border:0;background:var(--azul);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.enviar:hover{background:var(--azul-h)}

/* Consultas de ley */
.ley{border:1px solid var(--ln2);border-radius:12px;padding:10px 12px;background:#fff}
.ley-t{font-weight:700;font-size:14px;color:var(--azul)}
.ley-h{font-size:12px;color:var(--mu);margin-top:2px}
.ley-x{font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap}
.ley-mas{margin-top:6px;background:none;border:0;color:var(--azul);font-weight:600;font-size:13.5px;padding:6px 0;cursor:pointer;text-decoration:underline}
.ley-sub{font-size:13px;color:var(--mu);font-weight:600}
.ley-ops{display:flex;flex-wrap:wrap;gap:6px}
.ley-ops .chip{height:auto;min-height:34px;padding:6px 12px;font-size:13px;text-align:left}
.faq-r{font-size:15px;line-height:1.5}
.ley-nota{font-size:12.5px;color:var(--mu);font-style:italic}

/* Barra flotante de vidrio */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:calc(100% - 28px);max-width:452px;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 0 0 .5px rgba(0,58,110,.10),0 12px 36px rgba(0,58,110,.18)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:8px 2px 6px;border:0;background:none;border-radius:14px;min-height:58px;min-width:0;width:100%;cursor:pointer;color:var(--mu)}
.tab:hover{background:rgba(243,247,252,.8)}
.tab svg{width:24px;height:24px;flex:none}
.tab .tl{display:flex;align-items:flex-start;justify-content:center;height:24px;width:100%;font-size:10.5px;font-weight:500;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.tab .bar{display:block;width:36px;height:3px;border-radius:2px;background:transparent}
.tab.on{color:var(--azul)}
.tab.on .tl{font-weight:700}
.tab.on .bar{background:var(--azul)}

/* Transiciones y gestos */
@keyframes entraD{from{transform:translateX(28%);opacity:.3}to{transform:none;opacity:1}}
@keyframes entraI{from{transform:translateX(-28%);opacity:.3}to{transform:none;opacity:1}}
.entra-d{animation:entraD .26s cubic-bezier(.2,.8,.2,1)}
.entra-i{animation:entraI .26s cubic-bezier(.2,.8,.2,1)}
.scr{will-change:transform}
.app{overflow-x:clip;max-width:min(480px,100vw)}
#ptr{position:fixed;top:calc(var(--sat) + 0px);left:50%;transform:translate(-50%,-40px);z-index:15;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,58,110,.18);display:grid;place-items:center;color:var(--mu);transition:transform .2s}
#ptr.listo{color:var(--azul)}
#ptr.gira svg{animation:gira .7s linear infinite}
/* Aviso de actualización del APK */
.actualizar{min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(56px + var(--sat)) 28px calc(28px + var(--sab));gap:16px}
.actualizar img{width:120px;height:auto}
.actualizar h1{font-size:24px;font-weight:800;margin-top:8px}
.actualizar p{font-size:15.5px;color:var(--mu);line-height:1.5}
.pasos{text-align:left;align-self:stretch;background:var(--azul-cl);border-radius:18px;padding:16px 16px 16px 36px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45;box-shadow:var(--flota)}
.actualizar .btn-pri{margin-top:6px}
.instalar .ico-app{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 26px rgba(0,58,110,.2),0 0 0 1px var(--ln3)}
.instalar .pasos li svg{display:inline-block;vertical-align:-5px;margin:0 2px}
.instalar .pasos li{padding-left:2px}
.flecha-abajo{margin-top:auto;padding-top:8px;animation:rebota 1.2s ease-in-out infinite}
@keyframes rebota{50%{transform:translateY(8px)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--sab) + 18px);background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
#splash{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:30}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:22px}
#splash img{height:132px;animation:latido 1.15s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(0,58,110,.22))}
#splash .sp-barra{width:132px;height:4px;border-radius:2px;background:var(--ln3);overflow:hidden}
#splash .sp-barra i{display:block;height:100%;width:0;border-radius:2px;background:var(--azul);transition:width .6s cubic-bezier(.3,.7,.3,1)}
@keyframes latido{0%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%,100%{transform:scale(1)}}
@keyframes lat{50%{opacity:.6;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:350px){.tarjeta{min-height:150px;padding:14px}.tarjeta b{font-size:15.5px}.circ{width:48px;height:48px}}
/* ================= Material de vidrio (mismo de la barra) en recuadros y menús ================= */
:root{
  --g-bg:rgba(255,255,255,.58);--g-bg-fuerte:rgba(255,255,255,.78);--g-borde:rgba(255,255,255,.8);
  --g-blur:blur(22px) saturate(180%);
  --g-sombra:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 0 0 .5px rgba(0,58,110,.10),0 10px 30px rgba(0,58,110,.12);
  --g-tinte-az:rgba(238,245,252,.62);--g-tinte-ve:rgba(233,245,236,.62);
}
.tarjeta,.panel,.recibo,.pre,.cargando,.aviso,.ley,.pasos,.saldo.vacio{background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border:1px solid var(--g-borde);box-shadow:var(--g-sombra)}
.saludo{background:var(--g-tinte-az);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border:1px solid var(--g-borde);box-shadow:var(--g-sombra)}
.tarjeta:hover{border-color:var(--g-borde);box-shadow:var(--g-sombra),0 0 0 1.5px var(--azul)}
.caja{background:var(--g-bg-fuerte);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border:1px solid var(--g-borde);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.16),0 4px 14px rgba(0,58,110,.08)}
.caja:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 4px 14px rgba(0,58,110,.08)}
.hoja{background:var(--g-bg-fuerte);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--g-borde);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 -10px 34px rgba(0,58,110,.18)}
.hoja-fondo{background:rgba(15,25,40,.28)}
.pre-h{background:linear-gradient(180deg,rgba(var(--ac-rgb),.14),rgba(var(--ac-rgb),.07))}
.pre{--ac-rgb:0,104,184}.pre.v{--ac-rgb:30,138,60}
.pre-ok{background:rgba(var(--ac-rgb),.10)}
.pre-tag{background:rgba(255,255,255,.6)}
.recibo-h{background:linear-gradient(180deg,rgba(238,245,252,.7),rgba(238,245,252,.35))}
.rec-tot{background:rgba(250,251,253,.5)}
.msg-b{background:var(--g-tinte-az);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(0,58,110,.10),0 4px 14px rgba(0,58,110,.08)}
.yo .msg-b{background:var(--azul);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,104,184,.22)}
.msg-av{background:var(--g-tinte-az);box-shadow:0 0 0 .5px rgba(0,58,110,.12)}
.saldo{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 1px rgba(0,0,0,.08),0 10px 24px rgba(0,104,184,.22)}
.btn-pri,.btn-wa,.enviar{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,104,184,.22)}
.btn-sec{background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur)}
#splash{background:var(--fondo)}
html,body,.app{background:var(--fondo)}
:root{--fondo:#FFFFFF}

/* ================= Burbuja de vidrio en la barra ================= */
#nav{isolation:isolate;touch-action:none}
#nav .tab{position:relative;z-index:1;background:none!important;transition:color .25s}
#nav .tab:hover{background:none}
#nav .tab .bar{display:none}
#nav .tab svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#nav .tab.on svg{transform:scale(1.14)}
#nav .tab.cerca svg{transform:scale(1.24)}
#nav .tab.on.v{color:var(--verde)}
.burbuja{position:absolute;top:6px;bottom:6px;left:0;width:0;z-index:0;border-radius:24px;pointer-events:none;--tinte:0,104,184;
  background:linear-gradient(180deg,rgba(var(--tinte),.28),rgba(var(--tinte),.14));
  backdrop-filter:blur(6px) saturate(200%) brightness(1.08);-webkit-backdrop-filter:blur(6px) saturate(200%) brightness(1.08);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1.5px rgba(255,255,255,.45),inset 0 0 0 .5px rgba(var(--tinte),.35),0 6px 18px rgba(var(--tinte),.22),0 1px 3px rgba(0,0,0,.08);
  transition:transform .55s cubic-bezier(.25,1.45,.45,1),width .4s,background .45s,box-shadow .45s;transform-origin:center}
.burbuja::after{content:"";position:absolute;inset:2px 10% auto;height:42%;border-radius:20px 20px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.7}
.burbuja.v{--tinte:30,138,60}
.burbuja.arrastre{transition:background .3s,box-shadow .3s}
.burbuja.sin-anim{transition:none}
/* Android/Chrome: refracción real tipo lente */
html.lente .burbuja{z-index:2;background:linear-gradient(180deg,rgba(var(--tinte),.16),rgba(var(--tinte),.06));backdrop-filter:url(#lente) saturate(160%) brightness(1.05);-webkit-backdrop-filter:url(#lente) saturate(160%) brightness(1.05)}
@media (prefers-reduced-motion:reduce){.burbuja{transition:none}}

/* ================= Modo oscuro (según la configuración del teléfono) ================= */
@media (prefers-color-scheme: dark){
  :root{--azul:#3B9BEA;--azul-h:#5AADF0;--azul-os:#0A2A47;--azul-cl:#13283F;--verde:#34B35A;--verde-cl:#11301C;--tx:#E9EEF5;--mu:#9AA6B6;--mu2:#7A8696;--ln:#2A3646;--ln2:#243142;--ln3:#1E2938;--neg:#FF7A7A;
    --fondo:#0B1220;
    --g-bg:rgba(24,34,52,.55);--g-bg-fuerte:rgba(24,34,52,.82);--g-borde:rgba(255,255,255,.09);
    --g-sombra:inset 0 1px 0 rgba(255,255,255,.10),0 0 0 .5px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.45);
    --g-tinte-az:rgba(26,52,82,.55);--g-tinte-ve:rgba(20,52,32,.55);
    --flota:0 10px 28px rgba(0,0,0,.45)}
  .deco svg{opacity:.10!important}
  .deco img{opacity:.10!important;filter:invert(1) hue-rotate(180deg) brightness(1.5)}
  .caja{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 .5px rgba(0,0,0,.5)}
  .hoja{box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 -10px 34px rgba(0,0,0,.5)}
  .hoja-fondo{background:rgba(0,0,0,.5)}
  .recibo-h{background:linear-gradient(180deg,rgba(26,52,82,.7),rgba(26,52,82,.35));box-shadow:inset 0 -.5px 0 rgba(255,255,255,.06)}
  .rec-tot{background:rgba(10,16,28,.4)}
  .pre-tag{background:rgba(11,18,32,.6)}
  .pre{--ac-rgb:59,155,234}.pre.v{--ac-rgb:52,179,90}
  .pre-h{background:linear-gradient(180deg,rgba(var(--ac-rgb),.20),rgba(var(--ac-rgb),.08))}
  .saldo{background:#0F5FA8}
  .saldo-pill{background:rgba(0,0,0,.28)}
  .yo .msg-b{background:#1F6FBF}
  .msg-b{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 .5px rgba(0,0,0,.4)}
  .chip{background:var(--g-tinte-az);border-color:var(--g-borde);box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
  .vidrio{background:var(--g-bg);border-color:var(--g-borde);box-shadow:var(--g-sombra)}
  .hoy{background:rgba(24,34,52,.6);box-shadow:0 0 0 .5px rgba(255,255,255,.08)}
  .btn-sec{background:rgba(24,34,52,.4)}
  #nav{background:rgba(22,32,48,.55);border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.55)}
  .burbuja{background:linear-gradient(180deg,rgba(var(--tinte),.40),rgba(var(--tinte),.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.45)}
  .burbuja.v{--tinte:52,179,90}.burbuja{--tinte:59,155,234}
  .burbuja::after{opacity:.25}
  html.lente .burbuja{background:linear-gradient(180deg,rgba(var(--tinte),.32),rgba(var(--tinte),.12))}
  .avatar img{box-shadow:0 0 0 2px var(--fondo),0 0 0 3.5px var(--azul)}
  .top img,.home-top img,.login-escudo{filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
  .tri i:nth-child(2){background:#2A3646}
  .instalar .ico-app{box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
  .tarjeta:hover{box-shadow:var(--g-sombra),0 0 0 1.5px var(--azul)}
  input::placeholder{color:var(--mu2)}
  .chk input{accent-color:var(--azul)}
  #toast{background:#E9EEF5;color:#0B1220}
}


/* ================= Teclado en el chat ================= */
#nav{transition:transform .32s cubic-bezier(.3,.8,.3,1),opacity .25s}
body.teclado #nav{transform:translate(-50%,calc(100% + 30px));opacity:0;pointer-events:none}
#s-chat{transition:height .28s cubic-bezier(.3,.8,.3,1)}
body.teclado #s-chat{min-height:0!important;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--vvh,100dvh);z-index:5;background:var(--fondo)}
.chat-pie{transition:padding .32s cubic-bezier(.3,.8,.3,1)}
body.teclado .chat-pie{padding-bottom:10px}
body.teclado .deco{opacity:0}
.deco{transition:opacity .3s}
/* ================= Detalle de abonos ================= */
.pre.toca{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.pre.toca:active{transform:scale(.975)}
.pre-ver{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(var(--ac-rgb,0,104,184),.10);color:var(--ac);font-size:14.5px;font-weight:700}
.pre-ver-f{font-size:22px;line-height:1;font-weight:600}
.pre-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pre-st{flex:1 1 30%;min-width:96px;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:rgba(var(--ac-rgb,0,104,184),.08)}
.pre-st span{font-size:12px;color:var(--mu);font-weight:600}
.pre-st b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--tx)}

.pre-pill{display:inline-block;margin-top:10px;padding:7px 13px;border-radius:999px;background:rgba(var(--ac-rgb,0,104,184),.12);color:var(--ac);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ap-fila{flex-direction:column;align-items:stretch;gap:8px}
.ap-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ap-con{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:10px;background:rgba(var(--ac-rgb,0,104,184),.06)}
.ap-lin{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}

.pre-tono{--ac-rgb:0,104,184}.pre-tono.v{--ac-rgb:30,138,60}

/* ================= Halloween (solo con html.hw) ================= */
html.hw #splash{background:radial-gradient(120% 70% at 50% 34%,#3A1A5C 0%,#1B0E33 45%,#0B0716 100%);overflow:hidden;transition:opacity .45s ease}
html.hw #splash.fuera{opacity:0}
html.hw #splash .sp-in{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:3;gap:26px}
html.hw #splash img.sp-esc{height:min(36vw,150px);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 18px rgba(255,170,60,.85)) drop-shadow(0 12px 26px rgba(0,0,0,.55))}
html.hw #splash .sp-barra{width:150px;background:rgba(255,255,255,.14)}
html.hw #splash .sp-barra i{background:linear-gradient(90deg,#FF7A00,#FFB23F);box-shadow:0 0 10px #FF8A1E}
.hw-est{position:absolute;inset:0;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff8,transparent),radial-gradient(1.2px 1.2px at 28% 8%,#fff7,transparent),radial-gradient(1.4px 1.4px at 74% 12%,#fff8,transparent),radial-gradient(1px 1px at 88% 26%,#fff6,transparent),radial-gradient(1.3px 1.3px at 60% 4%,#fff7,transparent),radial-gradient(1px 1px at 6% 40%,#fff5,transparent),radial-gradient(1.2px 1.2px at 94% 46%,#fff6,transparent),radial-gradient(1px 1px at 40% 20%,#fff5,transparent);animation:hwTit 3.2s ease-in-out infinite alternate}
@keyframes hwTit{from{opacity:.45}to{opacity:1}}
.hw-sluna{position:absolute;left:50%;top:34%;width:min(78vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,196,92,.55) 0%,rgba(255,140,40,.28) 34%,rgba(255,110,20,.10) 55%,transparent 70%);animation:hwSL 1.15s ease-in-out infinite}
@keyframes hwSL{0%,70%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}14%{transform:translate(-50%,-50%) scale(1.10);opacity:1}42%{transform:translate(-50%,-50%) scale(1.05)}}
html.hw #splash img.hw-escena{position:absolute;left:50%;bottom:-2%;width:min(112vw,500px);height:auto;transform:translateX(-50%);filter:brightness(.82) drop-shadow(0 -6px 30px rgba(255,120,20,.25));animation:hwFl 4.5s ease-in-out infinite}
@keyframes hwFl{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.hw-niebla{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(0deg,rgba(11,7,22,.85),rgba(11,7,22,0))}
.hw-murc{position:absolute;width:34px;opacity:.75;pointer-events:none}
.hw-murc svg{width:100%;animation:hwAle .22s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes hwAle{to{transform:scaleY(.45)}}
#splash .hw-murc{animation:hwVuela linear infinite}
@keyframes hwVuela{0%{transform:translate(-20vw,0)}50%{transform:translate(50vw,-4vh)}100%{transform:translate(120vw,2vh)}}
.hw-hoja{position:absolute;top:-30px;animation:hwCae linear infinite}
.hw-hoja svg{width:100%;height:100%;animation:hwGira 3s ease-in-out infinite alternate}
@keyframes hwCae{to{transform:translate(var(--dx),118vh)}}
@keyframes hwGira{from{transform:rotate(-40deg)}to{transform:rotate(60deg)}}
/* Inicio: escudo con resplandor de luna (mismo tamaño de día y de noche) */
html.hw .home-top img{position:relative;z-index:1;filter:drop-shadow(0 0 10px rgba(255,150,40,.6)) drop-shadow(0 6px 14px rgba(0,0,0,.2));animation:hwLat 2.4s ease-in-out infinite}
html.hw .home-top::before{content:"";position:absolute;left:50%;top:calc(50% + 14px);width:112px;height:112px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,180,80,.38),rgba(255,130,30,.12) 45%,transparent 70%);animation:hwLuna 2.4s ease-in-out infinite;pointer-events:none}

@keyframes hwLat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}36%{transform:scale(1.04)}}
@keyframes hwLuna{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.home-top .hw-murc{width:22px;top:20px;left:50%;z-index:2;opacity:.85;animation:hwOrbita 7s linear infinite}
.home-top .hw-murc path{fill:#2a1840}

/* ================= Sudoku (3 toques al escudo de Inicio) ================= */
#home-caja{position:relative}
#home-caja>.sub-det{margin:0}
#home-caja>.sub-base.debajo-sub{left:0;right:0}
.sdk-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sdk-cab h2{flex:1;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sdk-salir{border:0;background:none;color:var(--azul);padding:4px;margin-left:-6px;cursor:pointer;display:grid;place-items:center}
.sdk-tiempo{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mu);font-size:15px;display:flex;align-items:center;gap:6px}
.sdk-niv{display:flex;gap:6px;margin-bottom:12px}
.sdk-niv button{flex:1;border:1px solid var(--g-borde);background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);color:var(--tx);font:inherit;font-size:14px;font-weight:700;padding:9px 0;border-radius:12px;cursor:pointer}
.sdk-niv button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.sdk-tab{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:420px;margin:0 auto;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--sdk-linea);background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-sombra);--sdk-linea:rgba(0,58,110,.55);--sdk-fina:rgba(0,58,110,.14);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sdk-c{position:relative;display:grid;place-items:center;border-right:1px solid var(--sdk-fina);border-bottom:1px solid var(--sdk-fina);font-size:min(6.2vw,26px);font-weight:600;color:var(--azul);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s}
.sdk-c:nth-child(9n){border-right:0}
.sdk-c:nth-child(9n+3),.sdk-c:nth-child(9n+6){border-right:2px solid var(--sdk-linea)}
.sdk-c:nth-child(n+19):nth-child(-n+27),.sdk-c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--sdk-linea)}
.sdk-c:nth-child(n+73){border-bottom:0}
.sdk-c.fija{color:var(--tx);font-weight:800}
.sdk-c.zona{background:rgba(0,104,184,.07)}
.sdk-c.igual{background:rgba(0,104,184,.18)}
.sdk-c.sel{background:rgba(0,104,184,.30)}
.sdk-c.mal{color:#D92D20}
.sdk-c.mal.fija{color:#D92D20}
.sdk-c.pista{color:var(--verde)}
.sdk-c.pop{animation:sdkPop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes sdkPop{50%{transform:scale(1.25)}}
.sdk-notas{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:min(2.4vw,10px);font-weight:600;color:var(--mu);line-height:1}
.sdk-notas i{display:grid;place-items:center;font-style:normal}
.sdk-herr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:14px auto 10px}
.sdk-herr button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:12px}
.sdk-herr button svg{width:24px;height:24px}
.sdk-herr button.on{color:var(--azul);background:rgba(0,104,184,.10)}
.sdk-herr button:active{transform:scale(.94)}
.sdk-nums{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;max-width:420px;margin:0 auto}
.sdk-nums button{aspect-ratio:.82;border:1px solid var(--g-borde);border-radius:12px;background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-sombra);color:var(--azul);font:inherit;font-size:24px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .2s}
.sdk-nums button:active{transform:scale(.9)}
.sdk-nums button.lleno{opacity:.25;pointer-events:none}
.sdk-fin{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,20,50,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;animation:sdkFade .3s ease}
.sdk-fin>div{text-align:center;padding:22px 24px;border-radius:20px;background:var(--g-bg);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border:1px solid var(--g-borde);box-shadow:var(--g-sombra);animation:sdkSube .4s cubic-bezier(.2,1.4,.4,1)}
.sdk-fin b{display:block;font-size:22px;margin-bottom:6px}
.sdk-fin p{color:var(--mu);font-size:14.5px;line-height:1.5}
.sdk-fin button{margin-top:14px;border:0;background:var(--azul);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:12px 22px;border-radius:14px;cursor:pointer}
@keyframes sdkFade{from{opacity:0}}
@keyframes sdkSube{from{transform:translateY(20px) scale(.9);opacity:0}}
.sdk-zona-tab{position:relative;max-width:420px;margin:0 auto}
@media (prefers-color-scheme:dark){.sdk-tab{--sdk-linea:rgba(140,190,255,.55);--sdk-fina:rgba(140,190,255,.14)}.sdk-c.zona{background:rgba(59,155,234,.10)}.sdk-c.igual{background:rgba(59,155,234,.22)}.sdk-c.sel{background:rgba(59,155,234,.38)}.sdk-c.mal{color:#FF6B5E}}
.home-top img.toque{animation:sdkToque .25s ease}
@keyframes sdkToque{50%{transform:scale(.9)}}
/* ================= Subpáginas ================= */
.sub-base,.sub-det{position:relative}
.sub-det{margin:0 -20px;padding:0 20px}

#prest-body,#fondo-body,#desg-body{position:relative}

/* ================= Gestos fluidos ================= */
html{overscroll-behavior:none}
.scr.arrastra{position:relative;z-index:3;background:transparent;box-shadow:none;will-change:transform}

.entra-d,.entra-i{will-change:transform}</style>

<script>
const ITER = 210000;

const fdate = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? pdate(s).toLocaleDateString('es-MX', o) : '—';

// Número corto (el que usan los trabajadores) ↔ número de nómina: 8 ↔ 10008, 1003 ↔ 11003, 5001 ↔ 15001
const normSocio = s => { const v = String(s || '').trim().replace(/\s+/g, '').toUpperCase(); return /^\d{1,4}$/.test(v) ? '1' + v.padStart(4, '0') : v; };
const corto = s => /^1\d{4}$/.test(String(s)) ? (String(s).slice(1).replace(/^0+/, '') || '0') : String(s);

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function cuentaId(socio) { return hex(await crypto.subtle.digest('SHA-256', te.encode('fondo-id:v1:' + normSocio(socio)))).slice(0, 40); }
async function deriveKey(socio, pin, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(normSocio(socio) + ':' + pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(socio, pin, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(socio, pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct)) };
}
async function unseal(socio, pin, d) {
  const key = await deriveKey(socio, pin, unb64(d.s), d.n || 210000);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.i) }, key, unb64(d.c));
  unseal.key = key;
  return JSON.parse(td.decode(pt));
}


async function buildDesglose(D) {
  await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const doc = await PDFDocument.create();
  const W = 792, H = 612; const page = doc.addPage([W, H]);
  const R = await doc.embedFont(StandardFonts.Helvetica), B = await doc.embedFont(StandardFonts.HelveticaBold);
  const black = rgb(0, 0, 0), GRAY = rgb(0.902, 0.902, 0.902), ZEB = rgb(0.953, 0.953, 0.953);
  const safe = s => String(s == null ? '' : s).replace(/[^\x20-\x7E -ÿ—·]/g, '?');
  const money = v => Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const txt = (s, x, y, f, z) => page.drawText(safe(s), { x, y, size: z, font: f, color: black });
  const wid = (s, f, z) => f.widthOfTextAtSize(safe(s), z);
  const fit = (s, f, z, w) => { s = safe(s); while (s.length > 3 && f.widthOfTextAtSize(s, z) > w) s = s.slice(0, -1); return s; };
  const I = D.info, L = 36, Rr = W - 36; let y = H - 36 - 8;
  txt('INGENIO TAMAZULA, S.A. DE C.V.', L, y, B, 8.5); y -= 10;
  txt('[ERPNORPNOM2] Movimientos por Empleado — Nómina: 2 - OBREROS', L, y, R, 7.5); y -= 10;
  txt(`Empresa 33 · Documento 50 NÓMINAS · Serie 2 OBREROS · Ejercicio ${I.ejercicio} · Periodo ${I.periodo} ${I.periodo_txt} · Folio ${I.folio} · Impreso ${I.impreso}`, L, y, R, 7.5); y -= 19;
  const rows = D.rows.map(r => ({ code: r[0], name: r[1], origen: r[2], fecha: r[3], tno: r[4], puesto: r[5], tno_p: r[6], dias: r[7], ctro: r[8], imp: r[9] }));
  const cnt = {}; let best = null;
  const cand = rows.filter(r => r.tno_p).length ? rows.filter(r => r.tno_p) : rows;
  cand.forEach(r => { const k = [r.tno, r.puesto, r.tno_p, r.ctro].join('|'); cnt[k] = (cnt[k] || 0) + 1; if (!best || cnt[k] > cnt[best]) best = k; });
  const [tno, pu, tp, ct] = (best || '|||').split('|');
  let t = `${D.id} — ${D.nombre}`; txt(t, L, y, B, 8); let x = L + wid(t, B, 8) + 12;
  t = `Factor: ${D.factor || ''}`; txt(t, x, y, R, 7.5); x += wid(t, R, 7.5) + 12;
  txt([tno ? `Turno ${tno}` : '', pu ? `Puesto ${pu}` : '', tp ? `TNO_P ${tp}` : '', ct ? `Centro ${ct}` : ''].filter(Boolean).join(' · '), x, y, R, 7.5);
  y -= 8;
  const n = rows.length + 3, rh = Math.min(14.6, (y - 60) / n), fs = Math.min(7.5, rh * 0.55);
  const COLS = [['code', 44, 'l', 'CONCEPTO'], ['name', 72, 'l', null], ['origen', 283, 'l', 'ORIGEN'], ['fecha', 400, 'c', 'FECHA'], ['tno', 442, 'c', 'TNO'],
    ['puesto', 493, 'c', 'PUESTO'], ['tno_p', 547, 'c', 'TNO_P'], ['dias', 578, 'c', 'DÍAS'], ['ctro', 606, 'c', 'CTRO.'], ['per', 682, 'r', 'PERCEPCIÓN'], ['ded', 750, 'r', 'DEDUCCIÓN']];
  const band = c => page.drawRectangle({ x: L, y: y - rh, width: Rr - L, height: rh, color: c });
  const put = (v, x0, al, f) => {
    const by = y - rh + (rh - fs) / 2 + fs * 0.18;
    if (al === 'l') txt(v, x0, by, f, fs);
    else if (al === 'r') txt(v, x0 - wid(v, f, fs), by, f, fs);
    else txt(v, x0 - wid(v, f, fs) / 2, by, f, fs);
  };
  const row = (vals, bg, bold) => {
    if (bg) band(bg);
    const f = bold ? B : R;
    COLS.forEach(([k, x0, al]) => {
      let v = vals[k]; if (!v) return;
      if (k === 'name') v = fit(v, f, fs, 278 - x0);
      if (k === 'origen') v = fit(v, f, fs, 372 - x0);
      if (k === 'puesto') v = fit(v, f, fs, 90);
      put(v, x0, al, f);
    });
    y -= rh;
  };
  band(GRAY); COLS.forEach(([k, x0, al, lab]) => { if (lab) put(lab, x0, al, B); }); y -= rh;
  rows.forEach((r, i) => {
    const d = parseInt(r.code, 10) >= 500;
    row({ code: r.code, name: r.name, origen: r.origen, fecha: r.fecha, tno: r.tno, puesto: r.puesto, tno_p: r.tno_p, dias: r.dias, ctro: r.ctro,
      per: d ? '' : money(r.imp), ded: d ? money(r.imp) : '' }, i % 2 ? ZEB : null, false);
  });
  row({ name: 'TOTALES POR EMPLEADO', per: '$' + money(D.tot[0]), ded: '-$' + money(D.tot[1]) }, GRAY, true);
  row({ name: 'NETO', ded: '$' + money(D.tot[2]) }, ZEB, true);
  doc.setTitle(`Desglose de nómina semana ${I.periodo} - ${D.id}`);
  return doc.save();
}

let waNumber = '', loan = null, pdfLibP = null;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga = (d = new Date()) => `${d.getDate()} de ${MESES[d.getMonth()]} del ${d.getFullYear()}`;
const MIN_W = new Set(['de', 'del', 'la', 'las', 'los', 'y']);
const titulo = s => String(s).toLowerCase().split(/\s+/).filter(Boolean).map((w, i) => i && MIN_W.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
function enLetras(n) {
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const dos = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? ' y ' + U[x % 10] : '');
  const tres = x => x === 100 ? 'cien' : [C[Math.floor(x / 100)], dos(x % 100)].filter(Boolean).join(' ');
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  if (n === 0) return 'cero';
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, out = [];
  if (mill) out.push(mill === 1 ? 'un millón' : apoc(tres(mill)) + ' millones');
  if (mil) out.push(mil === 1 ? 'mil' : apoc(tres(mil)) + ' mil');
  if (r) out.push(tres(r));
  return apoc(out.join(' '));
}
function cantidadConLetra(m) {
  const ent = Math.floor(m + 1e-9), cts = Math.round((m - ent) * 100);
  return `${money(m)} (${enLetras(ent)} pesos ${String(cts).padStart(2, '0')}/100 M.N.)`;
}
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve();
  if (!pdfLibP) pdfLibP = new Promise((res, rej) => {

  if (/(isr|impuesto|sat\b|renta|retencion|exent|declaracion|deduccion personal|deducciones personales|devolucion|subsidio)/.test(q)) return 'LISR';

}

const LENTE_OK = (() => { const ua = navigator.userAgent || ''; return /Chrome\/\d+/.test(ua) && !/iPhone|iPad|iPod|CriOS|Edg\//.test(ua) && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); })();

let lenteTam = '';
function ajustarLente(w, h) {

  w = Math.round(w); h = Math.round(h);
  const clave = w + 'x' + h; if (clave === lenteTam) return; lenteTam = clave;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), img = x.createImageData(w, h), r = Math.min(24, h / 2), banda = Math.min(13, h / 3);
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    // distancia al borde del rectángulo redondeado y dirección hacia el centro
    const cx = Math.min(Math.max(px, r), w - r), cy = Math.min(Math.max(py, r), h - r);
    let dx = px - cx, dy = py - cy, dist;
    if (dx || dy) { const l = Math.hypot(dx, dy); dist = r - l; dx /= l; dy /= l; }
    else { const izq = px, der = w - 1 - px, arr = py, aba = h - 1 - py; dist = Math.min(izq, der, arr, aba);
      dx = dist === izq ? -1 : dist === der ? 1 : 0; dy = dx ? 0 : (dist === arr ? -1 : 1); }
    const t = Math.max(0, Math.min(1, dist / banda)), f = (1 - t) * (1 - t);

    img.data[i] = 128 - dx * f * 127; img.data[i + 1] = 128 - dy * f * 127; img.data[i + 2] = 128; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const f = $('#lente'), m = $('#lente-mapa');
  f.setAttribute('width', w); f.setAttribute('height', h);
  m.setAttribute('width', w); m.setAttribute('height', h);
  m.setAttribute('href', c.toDataURL());
}

async function iniciar(socio, pin) {
  const id = await cuentaId(socio);
  const blob = DATA.cuentas[id];
  if (!blob) throw new Error('no');
  const data = await unseal(socio, pin, blob);
  session = { socio, pin, id, data, key: unseal.key, salt: blob.s };
  dCache = {}; semanaSel = null; chatIniciado = false; chatHist = []; $('#chat-log').replaceChildren();
}
async function refresh() {
  try { DATA = await cargarDatos(); waNumber = (DATA.meta && DATA.meta.whatsapp) || waNumber; } catch (e) { /* sin red: usa lo cargado */ }
  const blob = DATA && DATA.cuentas[session.id];
  if (!blob) throw new Error('gone');
  if (session.salt !== blob.s) {
    session.data = await unseal(session.socio, session.pin, blob);
    session.key = unseal.key; session.salt = blob.s; dCache = {};
  } else {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.i) }, session.key, unb64(blob.c));
    session.data = JSON.parse(td.decode(pt));
  }
  return session.data;
}

function leerFoto() { try { return localStorage.getItem(FKEY(session.socio)); } catch (e) { return null; } }
function pintarFoto() {
  const f = session && leerFoto(), img = $('#foto-img');
  if (f) { img.src = f; img.hidden = false; $('#foto-mono').style.display = 'none'; $('#foto-btn').setAttribute('aria-label', 'Cambiar tu foto'); }
  else { img.removeAttribute('src'); img.hidden = true; $('#foto-mono').style.display = ''; $('#foto-btn').setAttribute('aria-label', 'Agregar tu foto'); }
}
function hoja(titulo, texto, botones) {
  const f = el('div', 'hoja-fondo'); const h = el('div', 'hoja'); h.setAttribute('role', 'dialog'); h.setAttribute('aria-label', titulo);
  h.append(el('div', 'agarre'), el('h3', null, titulo)); if (texto) h.append(el('p', null, texto));
  const bs = el('div', 'btns');
  botones.forEach(([t, cls, fn]) => { const b = el('button', cls, t); b.type = 'button'; b.onclick = () => { f.remove(); fn && fn(); }; bs.append(b); });
  h.append(bs); f.append(h); f.addEventListener('click', e => { if (e.target === f) f.remove(); });
  document.body.append(f); bs.firstChild && bs.firstChild.focus();
}
$('#foto-btn').addEventListener('click', () => {
  if (!canStore()) { toast('Este teléfono no permite guardar la foto.'); return; }
  if (!leerFoto()) { $('#foto-in').click(); return; }
  hoja('Tu foto', 'Se guarda solo en este teléfono; nadie más la ve.', [
    ['Cambiar foto', 'btn-pri sm', () => $('#foto-in').click()],
    ['Quitar foto', 'btn-sec sm', () => { try { localStorage.removeItem(FKEY(session.socio)); } catch (e) {} pintarFoto(); toast('Foto quitada'); }],
    ['Cancelar', 'link', null]
  ]);
});
$('#foto-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file || !session) return;
  try {
    const url = URL.createObjectURL(file);
    const im = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const lado = Math.min(im.naturalWidth, im.naturalHeight), N = 320;
    const c = document.createElement('canvas'); c.width = c.height = N;
    const cx = c.getContext('2d'); cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, N, N);
    cx.drawImage(im, (im.naturalWidth - lado) / 2, (im.naturalHeight - lado) / 2, lado, lado, 0, 0, N, N);
    URL.revokeObjectURL(url);
    localStorage.setItem(FKEY(session.socio), c.toDataURL('image/jpeg', 0.85));
    pintarFoto(); vibrar(); toast('¡Listo! Tu foto se guardó en este teléfono.');
  } catch (err) { toast('No pude usar esa imagen. Prueba con otra.'); }
});

  m.append(el('div', 'pre-meta', x.sem ? `Al cierre de la semana ${x.sem}${x.anio ? ' de ' + x.anio : ''}${periodo(x.sem) ? ' (' + periodo(x.sem) + ')' : ''}` : 'Préstamo por acuerdo de asamblea'));

/* ----- Subpáginas: una página "doble" dentro de una sección (p. ej. Préstamos → abonos).
   SUB[pantalla] = { base, det }: deslizar a la derecha, la flecha de arriba y el botón atrás regresan a la base. */
const SUB = {};
function abrirSub(pantalla, base, det) {
  cerrarSub(pantalla, true);
  base.classList.add('sub-base'); base.hidden = true; base.after(det); det.hidden = false; det.classList.add('sub-det');
  SUB[pantalla] = { base, det };
  det.classList.remove('entra-d', 'entra-i'); void det.offsetWidth; det.classList.add('entra-d');
  window.scrollTo(0, 0);
}
function cerrarSub(pantalla, sinAnim) {
  const s = SUB[pantalla]; if (!s) return false;
  SUB[pantalla] = null;
  if (s.det.dataset.fijo) s.det.hidden = true; else s.det.remove();
  s.base.hidden = false;
  if (!sinAnim) { s.base.classList.remove('entra-d', 'entra-i'); void s.base.offsetWidth; s.base.classList.add('entra-i'); }
  window.scrollTo(0, 0);
  return true;
}
/* ----- Detalle de abonos de un préstamo (archivo cifrado aparte, se baja solo al abrirlo) ----- */
let pagCache = null;
async function cargarAbonos() {
  if (pagCache) return pagCache;
  const r = await fetch(`d/pag/${session.id}.bin?v=${(DATA.meta && DATA.meta.version) || ''}`, { cache: 'no-store' });
  if (r.status === 404) return (pagCache = []);
  if (!r.ok) throw new Error('http ' + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, session.key, buf.slice(12));
  return (pagCache = JSON.parse(td.decode(plain)));
}
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function mesDeSemana(w, y) { // jueves de la semana ISO
  if (!w || !y) return '';
  const j4 = new Date(Date.UTC(y, 0, 4)), lun1 = new Date(j4); lun1.setUTCDate(4 - ((j4.getUTCDay() + 6) % 7));
  const jue = new Date(lun1); jue.setUTCDate(lun1.getUTCDate() + (w - 1) * 7 + 3);
  return MESES_L[jue.getUTCMonth()] + ' ' + jue.getUTCFullYear();
}
async function abrirAbonos(i) {

  const m = el('div', 'pre-m');

  stats.append(st('Total abonado', money(total)), st('Abonos', String(P.length)));

  if (!P.length) { panel.replaceChildren(el('div', 'aviso', 'Aún no hay abonos registrados en este préstamo.')); return; }
  const frag = [];

function aB64(bytes) { let s = ''; const ch = 0x8000; for (let i = 0; i < bytes.length; i += ch) s += String.fromCharCode.apply(null, bytes.subarray(i, i + ch)); return btoa(s); }
async function guardarPDF(bytes, nombre) {
  if (ANDROID && ANDROID.guardarPdf) { ANDROID.guardarPdf(aB64(bytes), nombre); return; }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Descargando ' + nombre);
}
async function enviarPDF(bytes, nombre, texto) {
  const tel = String(waNumber || '').replace(/\D/g, ''), full = tel.length === 10 ? '52' + tel : tel;
  if (ANDROID && ANDROID.compartirPdf) { ANDROID.compartirPdf(aB64(bytes), nombre, texto, full); return; }
  try {
    const f = new File([bytes], nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: texto, title: nombre }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }

}

    for (let a = 0; a < 8; a++) { const t = a * Math.PI / 4, x = cx + Math.cos(t) * r * 1.55, y = cy + Math.sin(t) * r * 1.55; cortes += `M${(x + r * .42).toFixed(1)} ${y.toFixed(1)}a${(r * .42).toFixed(1)} ${(r * .42).toFixed(1)} 0 1 0 ${(-r * .84).toFixed(1)} 0a${(r * .42).toFixed(1)} ${(r * .42).toFixed(1)} 0 1 0 ${(r * .84).toFixed(1)} 0Z`; }
    cortes += `M${(cx + r * .7).toFixed(1)} ${cy}a${(r * .7).toFixed(1)} ${(r * .7).toFixed(1)} 0 1 0 ${(-r * 1.4).toFixed(1)} 0a${(r * .7).toFixed(1)} ${(r * .7).toFixed(1)} 0 1 0 ${(r * 1.4).toFixed(1)} 0Z`;
    for (let k = 0; k < 4; k++) { const x = w * (k + .5) / 4, y = 10; cortes += `M${x} ${y - 3}l3 3-3 3-3-3Z`; }
    for (let k = 0; k < 3; k++) { const x = w * (k + .5) / 3, y = base - 7; cortes += `M${x} ${y - 3.5}l3.5 3.5-3.5 3.5-3.5-3.5Z`; }
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="animation-delay:${-(i * .37) % 2.6}s"><path fill="${col}" fill-rule="evenodd" d="${d}${cortes}"/></svg>`;
  };
  const papel = (n, w, h, cls) => { const p = el('div', 'dm-papel' + (cls ? ' ' + cls : '')); const t = el('div', 'tira'); let hh = ''; for (let i = 0; i < n; i++) hh += bandera(COLP[i % COLP.length], w, h, i); t.innerHTML = hh; p.append(el('div', 'cuerda'), t); return p; };
  // flor de cempasúchil: anillos de pétalos
  const flor = () => { let g = ''; const anillos = [[12, 9, 4.2, '#E86A00'], [10, 6.3, 3.8, '#FF8C00'], [8, 3.8, 3.2, '#FFA51F'], [6, 1.6, 2.6, '#FFC233']];
    anillos.forEach(([n, R, r, c], j) => { for (let k = 0; k < n; k++) { const t = (k + j * .5) * 2 * Math.PI / n; g += `<circle cx="${(12 + Math.cos(t) * R).toFixed(2)}" cy="${(12 + Math.sin(t) * R).toFixed(2)}" r="${r}" fill="${c}"/>`; } });
    return `<svg viewBox="0 0 24 24">${g}<circle cx="12" cy="12" r="1.8" fill="#C45100"/></svg>`; };
  const petalo = c => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2c4 3 6 8 4 13-1 3-3 5-4 7-1-2-3-4-4-7-2-5 0-10 4-13z"/></svg>`;
  const flores = (cont, n, dur) => { for (let i = 0; i < n; i++) { const esFlor = i % 3 !== 2, t = esFlor ? 16 + Math.random() * 14 : 10 + Math.random() * 6, f = el('div', 'dm-flor');
    f.style.cssText = `left:${Math.random() * 100}%;width:${t}px;height:${t}px;--dx:${Math.random() * 120 - 60}px;animation-duration:${dur + Math.random() * dur * .7}s;animation-delay:${-Math.random() * dur * 1.5}s;opacity:${.6 + Math.random() * .35}`;
    f.innerHTML = esFlor ? flor() : petalo(['#FF8C00', '#FFA51F', '#E86A00'][i % 3]); cont.append(f); } };
  // pantalla de carga
  const sp = $('#splash');
  const pareja = el('div', 'dm-pareja'); const a = el('img', 'ella'), b = el('img', 'el'); a.src = 'dm_ella.webp'; b.src = 'dm_el.webp'; a.alt = b.alt = ''; pareja.append(b, a);
  sp.prepend(papel(9, 40, 52), papel(8, 34, 44, 'dos'), el('div', 'dm-luz'), el('div', 'dm-piso'), pareja); flores(sp, 12, 7);
  // dentro de la app: papel picado detrás del escudo
  const top = document.querySelector('.home-top'); top.prepend(papel(9, 30, 40));
  DM_CARD = el('section', 'dm-card');
  DM_CARD.innerHTML = '<b>¡Feliz Día de Muertos!</b><p>Recordemos con cariño a quienes ya no están.</p><img src="dm_card.webp" alt="">';
  $('#s-home .saludo').after(DM_CARD);
  const deco = document.querySelector('.deco'); const di = el('img', 'dm-deco'); di.src = 'dm_fondo.webp'; di.alt = ''; deco.append(di);
  const F = el('div', 'dm-flores'); deco.after(F); flores(F, 10, 11);
})();

function ocultarSplash() {
  barra(100);
  if (!HW && !DM) { setTimeout(() => { $('#splash').hidden = true; }, 260); return; }
  // en temporada la pantalla de carga se ve al menos 1.6 s y se desvanece
  const espera = Math.max(260, 1600 - (Date.now() - HW_T0));
  setTimeout(() => { const sp = $('#splash'); sp.classList.add('fuera'); setTimeout(() => { sp.hidden = true; }, 460); }, espera);
}
requestAnimationFrame(() => barra(35));
async function versionPublicada() {
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal }); clearTimeout(to);
    if (!r.ok) return null; const j = await r.json(); return j && j.v ? String(j.v) : null;
  } catch (e) { return null; }
}
function recargarCon(v) {
  try { sessionStorage.setItem('s80_upd', v); } catch (e) {}
  barra(100);
  $('#splash').hidden = false;
  setTimeout(() => { location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash); }, 350);
}
async function buscarActualizacion() {
  const v = await versionPublicada();
  if (!v || v === APP_VERSION) return false;
  let ya = ''; try { ya = sessionStorage.getItem('s80_upd') || ''; } catch (e) {}
  if (ya === v) return false;  // ya se intentó con esta versión: no entrar en ciclo
  recargarCon(v); return true;
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  try { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}); } catch (e) {}
}
let ocultoDesde = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { ocultoDesde = Date.now(); return; }
  if (ocultoDesde && Date.now() - ocultoDesde > 10 * 60 * 1000) {
    const v = await versionPublicada();
    if (v && v !== APP_VERSION) { barra(15); recargarCon(v); }
  }
});
(async () => {
  const t0 = Date.now();
  if (await buscarActualizacion()) return;
  const espera = 900 - (Date.now() - t0); if (espera > 0) await new Promise(r => setTimeout(r, espera));
  barra(65);
  if (apkViejo()) { pedirActualizar(); return; }
  let saltar = false; try { saltar = sessionStorage.getItem('s80_nav') === '1'; } catch (e) {}
  if (!saltar && iosEnNavegador()) { pedirInstalarIOS(); return; }
  if (!saltar && androidEnNavegador()) { pedirInstalarAndroid(); return; }
  arrancar();
})();
