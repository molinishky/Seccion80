<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sección 80">
<title>Sección 80</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0068B8;--azul-h:#00579A;--azul-cl:#EEF5FC;--tx:#1F2430;--mu:#5B6575;--ln:#D3DAE3;--ln2:#E1E6ED;--ln3:#E6E9EE;
  --rojo:#E3202B;--amar:#FFE600;--verde:#1E8A3C;--neg:#B4232C;--bg:#F6F8FB;--card:#FFFFFF;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(255,214,0,.75);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--ln3)}}
.franja{display:flex;height:4px}.franja i{flex:1}.franja i:nth-child(1){background:var(--rojo)}.franja i:nth-child(2){background:var(--amar)}.franja i:nth-child(3){background:var(--azul)}.franja i:nth-child(4){background:var(--verde)}
.scr{padding:calc(var(--sat) + 0px) 0 calc(88px + var(--sab))}
#s-login{padding-bottom:calc(24px + var(--sab))}

/* Encabezado */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--ln3);padding-top:var(--sat)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.top img{height:38px;width:auto}
.top-t{flex:1;min-width:0}
.top-t b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.top-t span{display:block;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--mu);cursor:pointer}
.ico-btn:hover{background:var(--azul-cl);color:var(--azul)}
.pad{padding:16px}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;padding:calc(36px + var(--sat)) 24px 0;min-height:100dvh}
.login-escudo{height:132px;width:auto;margin-bottom:14px}
.login h1{font-size:28px;font-weight:800;letter-spacing:.01em}
.login .sub{color:var(--mu);font-size:15px;margin-top:4px;text-align:center}
.login .franja{width:120px;margin:18px 0 26px;border-radius:2px;overflow:hidden}
.form{width:100%;display:flex;flex-direction:column;gap:16px}
.campo label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.inp{position:relative}
.inp input{width:100%;height:54px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;padding:0 16px;font-size:18px;letter-spacing:.02em;transition:border-color .15s}
.inp input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(255,214,0,.45)}
.inp input::placeholder{color:#A0A8B4;letter-spacing:0;font-size:16px}
#pin{padding-right:56px;letter-spacing:.3em}
#ojo{position:absolute;right:5px;top:5px}
#ojo .c{display:none}#ojo.on .c{display:block}#ojo.on .o{display:none}
.hola{min-height:20px;font-size:14.5px;color:var(--azul);font-weight:600;margin-top:-6px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;user-select:none;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--azul)}
.msg-err{min-height:20px;font-size:14px;color:var(--neg);text-align:center}
.btn-pri,.btn-sec,.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;border:0;font-weight:700;font-size:16.5px;cursor:pointer;text-decoration:none;width:100%;transition:background .15s,transform .05s}
.btn-pri{background:var(--azul);color:#fff}.btn-pri:hover{background:var(--azul-h)}
.btn-pri:active,.btn-sec:active,.btn-wa:active{transform:scale(.985)}
.btn-pri:disabled{opacity:.6;cursor:default}
.btn-sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}.btn-sec:hover{background:var(--azul-cl)}
.btn-wa{background:#1E8A3C;color:#fff}.btn-wa:hover{background:#18742F}
.sm{height:46px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;cursor:pointer;padding:12px;margin-top:4px}
.pie{margin-top:auto;padding:28px 0 8px;font-size:12.5px;color:var(--mu);text-align:center}

/* Inicio */
.saludo{background:var(--azul-cl);border:1px solid #D6E6F5;border-radius:18px;padding:18px 18px 16px}
.saludo small{font-size:13.5px;color:var(--azul);font-weight:600}
.saludo h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px;line-height:1.2}
.saludo p{font-size:14px;color:var(--mu);margin-top:6px}
.tarjetas{display:grid;gap:12px;margin-top:14px}
.tarjeta{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ln2);border-radius:18px;padding:16px;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,box-shadow .15s}
.tarjeta:hover{border-color:var(--azul);box-shadow:0 2px 10px rgba(0,104,184,.08)}
.tarjeta .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic.az{background:var(--azul-cl);color:var(--azul)}.ic.ve{background:#E9F5EC;color:var(--verde)}
.tarjeta .tx{flex:1;min-width:0}
.tarjeta b{display:block;font-size:16.5px;font-weight:700}
.tarjeta span{display:block;font-size:14px;color:var(--mu);margin-top:3px}
.tarjeta .ch{color:#A0A8B4}
.ayuda{margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;border:1px dashed var(--ln);font-size:14px;color:var(--mu);cursor:pointer;width:100%;text-align:left}
.ayuda b{color:var(--azul)}

/* Fondo */
.saldo{display:flex;flex-direction:column;gap:6px;background:linear-gradient(150deg,#0B78CC,#00579A);color:#fff;border-radius:20px;padding:22px 20px;position:relative;overflow:hidden}
.saldo::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.saldo-lbl{font-size:14px;opacity:.9;font-weight:600}
.saldo-amt{font-size:38px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.saldo-meta{font-size:13.5px;opacity:.88}
.saldo-pill{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600}
.saldo.vacio{background:#fff;color:var(--tx);border:1px solid var(--ln2)}
.saldo.vacio::after{display:none}
.saldo-sin{font-size:20px;font-weight:700}
.panel{margin-top:14px;background:#fff;border:1px solid var(--ln2);border-radius:18px;padding:16px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:6px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln3)}
.fila:first-child{border-top:0}
.fila-l{display:flex;flex-direction:column;gap:2px}
.fila-t{font-size:14.5px;font-weight:600}
.fila-s{font-size:13px}.pos{color:var(--verde)}.neg{color:var(--neg)}
.fila-r{font-weight:700;font-variant-numeric:tabular-nums}
.cargando,.aviso{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px;background:#fff;border:1px solid var(--ln2);border-radius:18px}
.cargando::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--ln2);border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Desglose */
.sel-lbl{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:54px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;padding:0 44px 0 16px;font-size:16px;font-weight:600;cursor:pointer}
.sel select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(255,214,0,.45)}
.sel::after{content:"";position:absolute;right:18px;top:22px;width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);pointer-events:none}
.recibo{margin-top:14px;background:#fff;border:1px solid var(--ln2);border-radius:18px;overflow:hidden}
.recibo-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ln3)}
.recibo-h b{font-size:15.5px}
.recibo-h span{font-size:12.5px;color:var(--mu)}
#recibo .cargando,#recibo .aviso{border:0;border-radius:0}
.rec-per{padding:10px 16px;font-size:13px;color:var(--mu);background:#FAFBFD;border-bottom:1px solid var(--ln3)}
.rec-lista{padding:0 16px}
.rec-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln3)}
.rec-fila:first-child{border-top:0}
.rec-l{display:flex;flex-direction:column;min-width:0}
.rec-c{font-size:14px;font-weight:600}
.rec-d{font-size:12.5px;color:var(--mu)}
.rec-m{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-tot{border-top:1px solid var(--ln2);padding:12px 16px;background:#FAFBFD}
.rec-tl{display:flex;justify-content:space-between;font-size:14.5px;padding:4px 0;font-variant-numeric:tabular-nums}
.rec-tl.neto{font-size:17px;font-weight:800;color:var(--azul);border-top:1px solid var(--ln2);margin-top:6px;padding-top:10px}
#descargar{margin-top:14px}

/* Chat */
#s-chat{display:flex;flex-direction:column;height:100dvh;padding-bottom:0}
#s-chat[hidden]{display:none!important}
.chat-log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:88%}
.msg.yo{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--ln2);display:grid;place-items:center;flex:none;overflow:hidden}
.msg-av img{height:24px}
.msg-col{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg-b{background:#fff;border:1px solid var(--ln2);border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.yo .msg-b{background:var(--azul);color:#fff;border-color:var(--azul);border-radius:16px 4px 16px 16px}
.msg-h{font-size:11.5px;color:#9AA3AF;padding:0 4px}
.yo .msg-h{text-align:right}
.msg-acc{display:flex;flex-direction:column;gap:10px;white-space:normal}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#A0A8B4;animation:pt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-pie{background:#fff;border-top:1px solid var(--ln3);padding:8px 12px calc(88px + var(--sab))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #CFE0F1;background:var(--azul-cl);color:var(--azul);font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--azul)}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;height:48px;border:1.5px solid var(--ln);border-radius:999px;padding:0 18px;font-size:16px;background:#fff;min-width:0}
.chat-form input:focus{outline:none;border-color:var(--azul)}
.enviar{width:48px;height:48px;border-radius:50%;border:0;background:var(--azul);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.enviar:hover{background:var(--azul-h)}
.en-linea{display:inline-flex;align-items:center;gap:5px}
.en-linea::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--verde)}

/* Consultas de ley */
.ley{border:1px solid var(--ln2);border-left:3px solid var(--azul);border-radius:10px;padding:10px 12px;background:#FAFBFD}
.ley-t{font-weight:700;font-size:14px;color:var(--azul)}
.ley-h{font-size:12px;color:var(--mu);margin-top:2px}
.ley-x{font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap}
.ley-mas{margin-top:6px;background:none;border:0;color:var(--azul);font-weight:600;font-size:13.5px;padding:6px 0;cursor:pointer;text-decoration:underline}
.ley-sub{font-size:13px;color:var(--mu);font-weight:600}
.ley-ops{display:flex;flex-wrap:wrap;gap:6px}
.ley-ops .chip{height:auto;min-height:34px;padding:6px 12px;font-size:13px;text-align:left}
.ley-nota{font-size:12.5px;color:var(--mu);font-style:italic}
.msg:has(.ley){max-width:96%}
/* Navegación */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln3);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(6px + var(--sab))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px;min-width:0;width:100%;border:0;background:none;color:#7C8696;font-size:11px;font-weight:600;cursor:pointer;border-radius:12px;min-height:56px;text-align:center;line-height:1.15}
.tab svg{width:24px;height:24px}
.tab .tl{display:flex;align-items:flex-start;justify-content:center;height:26px;width:100%;overflow-wrap:anywhere}
.tab.on{color:var(--azul)}
.tab.on .tb{background:var(--azul-cl)}
.tb{display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background .15s}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));background:#1F2430;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
#splash{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:30}
#splash img{height:120px;animation:lat 1.4s ease-in-out infinite}
@keyframes lat{50%{opacity:.6;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<div id="splash"><img src="escudo.png" alt="Sección 80"></div>

<!-- ============ LOGIN ============ -->
<main id="s-login" class="scr">
  <div class="login">
    <img class="login-escudo" src="escudo.png" alt="Escudo Sección 80">
    <h1>SECCIÓN 80</h1>
    <p class="sub">Secretaría de Relaciones · Ingenio Tamazula</p>
    <div class="franja"><i></i><i></i><i></i><i></i></div>
    <form id="login-form" class="form" novalidate>
      <div class="campo">
        <label for="ibm">Número de IBM</label>
        <div class="inp"><input id="ibm" inputmode="numeric" autocomplete="username" placeholder="Ej. 235" maxlength="8"></div>
      </div>
      <p id="hola" class="hola" aria-live="polite"></p>
      <div class="campo" id="pin-row">
        <label for="pin">PIN</label>
        <div class="inp">
          <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4 dígitos" maxlength="6">
          <button type="button" id="ojo" class="ico-btn" aria-label="Mostrar PIN">
            <svg class="o" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="c" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <label class="chk" id="rec-row"><input type="checkbox" id="recordar" checked> Recordarme en este teléfono</label>
      <p id="login-msg" class="msg-err" role="alert"></p>
      <button class="btn-pri" id="entrar" type="submit">Iniciar sesión</button>
    </form>
    <button class="link" id="olvidar" type="button" hidden>Olvidar este teléfono</button>
    <p class="pie">Tu información es privada: solo tú puedes verla con tu IBM y PIN.</p>
  </div>
</main>

<!-- ============ INICIO ============ -->
<main id="s-home" class="scr" hidden>
  <header class="top"><div class="top-in">
    <img src="escudo.png" alt="">
    <div class="top-t"><b>SECCIÓN 80</b><span>Secretaría de Relaciones</span></div>
    <button class="ico-btn" id="salir" aria-label="Cerrar sesión"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg></button>
  </div><div class="franja"><i></i><i></i><i></i><i></i></div></header>
  <div class="pad">
    <section class="saludo">
      <small>Hola,</small>
      <h2 id="home-nombre"></h2>
      <p id="home-ibm"></p>
    </section>
    <div class="tarjetas">
      <button class="tarjeta" data-go="desglose"><span class="ic az" id="ic-desg"></span><span class="tx"><b>Desglose de nóminas</b><span id="card-desg-sub"></span></span><span class="ch" id="ch1"></span></button>
      <button class="tarjeta" data-go="fondo"><span class="ic ve" id="ic-fondo"></span><span class="tx"><b>Fondo de ahorro</b><span id="card-fondo-sub"></span></span><span class="ch" id="ch2"></span></button>
    </div>
    <button class="ayuda" data-go="chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0068B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>¿Tienes una duda? <b>Escríbenos en el chat</b></span></button>
  </div>
</main>

<!-- ============ FONDO ============ -->
<main id="s-fondo" class="scr" hidden>
  <header class="top"><div class="top-in">
    <img src="escudo.png" alt="">
    <div class="top-t"><b>Fondo de ahorro</b><span>Saldo actualizado al abrir</span></div>
  </div></header>
  <div class="pad" id="fondo-body"></div>
</main>

<!-- ============ DESGLOSE ============ -->
<main id="s-desglose" class="scr" hidden>
  <header class="top"><div class="top-in">
    <img src="escudo.png" alt="">
    <div class="top-t"><b>Desglose de nóminas</b><span>Tu recibo semanal</span></div>
  </div></header>
  <div class="pad">
    <label class="sel-lbl" for="semana">Semana</label>
    <div class="sel"><select id="semana"></select></div>
    <section class="recibo">
      <div class="recibo-h"><b id="recibo-tit">Recibo</b><span>Vista previa</span></div>
      <div id="recibo"></div>
    </section>
    <button class="btn-pri" id="descargar" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 19.5h14"/></svg><span>Descargar PDF</span></button>
  </div>
</main>

<!-- ============ CHAT ============ -->
<main id="s-chat" class="scr" hidden>
  <header class="top"><div class="top-in">

const normSocio = s => { const v = String(s || '').trim().replace(/\s+/g, '').toUpperCase(); return /^\d{1,4}$/.test(v) ? '1' + v.padStart(4, '0') : v; };

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }

async function cuentaId(socio) { return hex(await crypto.subtle.digest('SHA-256', te.encode('fondo-id:v1:' + normSocio(socio)))).slice(0, 40); }
async function deriveKey(socio, pin, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(normSocio(socio) + ':' + pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function seal(socio, pin, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(socio, pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct)) };

async function unseal(socio, pin, d) {

  const dos = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? ' y ' + U[x % 10] : '');

  sel.disabled = false; $('#descargar').hidden = false;
  if (!semanaSel || !sem.includes(semanaSel)) semanaSel = sem[0];
  sel.replaceChildren(...sem.map(w => { const o = el('option', null, `Semana ${w}${periodo(w) ? ' · ' + periodo(w) : ''}`); o.value = w; return o; }));
  sel.value = String(semanaSel);
  await pintarRecibo();
}
$('#semana').addEventListener('change', e => { semanaSel = +e.target.value; pintarRecibo(); });
async function pintarRecibo() {
  const w = semanaSel, vista = $('#recibo');
  $('#recibo-tit').textContent = `Recibo · Semana ${w}`;
  vista.replaceChildren(el('div', 'cargando', 'Cargando tu recibo…'));
  let D;
  try { D = await cargarDesglose(w); } catch (e) { vista.replaceChildren(el('div', 'aviso', 'No pude abrir tu recibo. Revisa tu conexión a internet.')); return; }
  if (semanaSel !== w) return;
  const per = el('div', 'rec-per', `Del periodo ${D.info.periodo_txt} · Folio ${D.info.folio}`);
  const lista = el('div', 'rec-lista');
  D.rows.forEach(r => {
    const ded = parseInt(r[0], 10) >= 500;
    const row = el('div', 'rec-fila');
    const l = el('div', 'rec-l');
    l.append(el('span', 'rec-c', `${r[0]} ${r[1]}`), el('span', 'rec-d', `${r[3]} · ${r[5]}`));
    row.append(l, el('span', 'rec-m ' + (ded ? 'neg' : ''), (ded ? '−' : '') + money(r[9])));
    lista.append(row);
  });
  const tot = el('div', 'rec-tot');
  const t1 = el('div', 'rec-tl'); t1.append(el('span', null, 'Percepciones'), el('span', null, money(D.tot[0])));
  const t2 = el('div', 'rec-tl'); t2.append(el('span', null, 'Deducciones'), el('span', 'neg', '−' + money(D.tot[1])));
  const t3 = el('div', 'rec-tl neto'); t3.append(el('span', null, 'Neto'), el('span', null, money(D.tot[2])));
  tot.append(t1, t2, t3);
  vista.replaceChildren(per, lista, tot);
}
$('#descargar').addEventListener('click', async () => {
  const b = $('#descargar'); b.disabled = true;
  try {
    const D = await cargarDesglose(semanaSel);
    const pdf = await buildDesglose(D);
    await guardarPDF(pdf, `Desglose_nomina_s${semanaSel}_${corto(session.socio)}.pdf`);
  } catch (e) { toast('No pude generar el PDF. Inténtalo de nuevo.'); }
  b.disabled = false;
});

/* ================= PDF: guardar y enviar ================= */
function aB64(bytes) { let s = ''; const ch = 0x8000; for (let i = 0; i < bytes.length; i += ch) s += String.fromCharCode.apply(null, bytes.subarray(i, i + ch)); return btoa(s); }
async function guardarPDF(bytes, nombre) {
  if (ANDROID && ANDROID.guardarPdf) { ANDROID.guardarPdf(aB64(bytes), nombre); return; }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Descargando ' + nombre);
}
async function enviarPDF(bytes, nombre, texto) {
  const tel = String(waNumber || '').replace(/\D/g, ''), full = tel.length === 10 ? '52' + tel : tel;
  if (ANDROID && ANDROID.compartirPdf) { ANDROID.compartirPdf(aB64(bytes), nombre, texto, full); return; }
  try {
    const f = new File([bytes], nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: texto, title: nombre }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  await guardarPDF(bytes, nombre);
  const link = waLink(texto);
  if (link) window.open(link, '_blank', 'noopener');
}
let toastT = null;
function toast(t) { const x = $('#toast'); x.textContent = t; x.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { x.hidden = true; }, 3200); }

/* ================= Chat ================= */
let chatIniciado = false, chatStage = 'chat';
const clog = $('#chat-log');
const hora = () => { const d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
function burbuja(quien, contenido) {
  const w = el('div', 'msg ' + quien);
  if (quien === 'bot') { const av = el('div', 'msg-av'); const im = el('img'); im.src = 'escudo.png'; im.alt = ''; av.append(im); w.append(av); }
  const col = el('div', 'msg-col');
  const b = el('div', 'msg-b'); typeof contenido === 'string' ? (b.textContent = contenido) : b.append(contenido);
  col.append(b, el('span', 'msg-h', hora()));
  w.append(col); clog.append(w);
  requestAnimationFrame(() => { clog.scrollTop = clog.scrollHeight; });
  return w;
}
const bot = c => burbuja('bot', c), yo = t => burbuja('yo', t);
function escribiendo() { const d = el('span', 'dots'); d.append(el('i'), el('i'), el('i')); return bot(d); }
function chips(list) {
  const c = $('#chat-chips');
  c.replaceChildren(...list.map(t => { const b = el('button', 'chip', t); b.type = 'button'; b.onclick = () => enviarChat(t); return b; }));
}
function abrirChat() {
  if (chatIniciado) return;
  chatIniciado = true; chatStage = 'chat';
  const d = session.data, pn = primerNombre(d), sem = semanas(d);
  bot(`Hola${pn ? ', ' + pn : ''}. Soy el asistente de la Secretaría de Relaciones. Puedo darte tu saldo del fondo de ahorro, tu desglose de nómina o resolver tus dudas sobre la Ley Federal del Trabajo, el Contrato Ley y el ISR.`);
  chips(baseChips());
}
function baseChips() { const sem = semanas(session.data); return [...(sem.length ? [`Desglose semana ${sem[0]}`] : []), 'Mi saldo', '¿Cuántos días de vacaciones me tocan?', '¿Cuándo pagan el aguinaldo?']; }
$('#chat-form').addEventListener('submit', e => { e.preventDefault(); const v = $('#mensaje').value; $('#mensaje').value = ''; enviarChat(v); });
async function enviarChat(raw) {
  const text = String(raw || '').trim(); if (!text) return;
  yo(text);
  const q = text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (chatStage === 'loan' || chatStage === 'loanConfirm') return pasoPrestamo(text, q);
  const legal = /(articulo|art\.|clausula|\bley\b|contrato|reglamento|que dice|lft|isr|\bsat\b|impuesto)/.test(q);
  if (!legal && /(prestamo|credito|adelanto)/.test(q)) return iniciarPrestamo();
  const pideDesg = !legal && /(desglose|recibo|nomina|percepcion|deduccion)/.test(q);
  const pideSaldo = !legal && /(saldo|fondo|ahorro|cuanto tengo|dinero|aportacion)/.test(q) && !/(cuando|como|reparte|porcentaje|que es|quien|intereses|rendimiento|funciona|reglas|regla|derecho)/.test(q);
  if (pideDesg || pideSaldo) {
    const t = escribiendo();
    let d; try { d = await refresh(); } catch (e) { t.remove(); bot('No pude cargar tu información. Revisa tu conexión a internet.'); return; }
    await new Promise(r => setTimeout(r, 250)); t.remove();
    if (pideDesg) return chatDesglose(q, d);
    if (d.fondo === false) { bot('Aún no tienes saldo registrado en el fondo de ahorro.'); return; }
    const h = d.historial || [], last = h[h.length - 1];
    bot(`Tu saldo actual del fondo de ahorro es ${money(d.saldo)}, al ${fdate(d.actualizado)}${last && last.p ? ' (semana ' + last.p + ')' : ''}.`);
    const b = el('button', 'btn-sec', 'Ver mi fondo de ahorro'); b.type = 'button'; b.dataset.go = 'fondo'; bot(b);
    return;
  }
  if (/^(hola|buen|que tal|hey|gracias)\b/.test(q) && q.split(/\s+/).length <= 4) { bot(/^gracias/.test(q) ? '¡Con gusto! Aquí estoy para lo que necesites.' : '¡Hola! ¿Quieres tu saldo, tu desglose de nómina o tienes alguna duda sobre la ley o el Contrato Ley?'); chips(baseChips()); return; }
  if (legal || esConsultaLey(q) || tokens(text).length >= 2) { if (await responderLey(text)) return; }
  bot('No encontré algo claro sobre eso. Puedo darte tu saldo del fondo de ahorro, tu desglose de nómina de cualquier semana o buscar en la Ley Federal del Trabajo, el Contrato Ley y la Ley del ISR. Prueba, por ejemplo: "¿qué dice la ley sobre la prima vacacional?" o "artículo 87".');
  chips(baseChips());
}
async function chatDesglose(q, d) {
  const sem = semanas(d);
  if (!sem.length) { bot('Aún no hay desgloses de nómina disponibles para ti.'); return; }
  const m = q.match(/(?:semana|sem|s)\s*(\d{1,2})/);
  let w = sem[0];
  if (m) { const x = +m[1]; if (!sem.includes(x)) { bot(`No tengo tu desglose de la semana ${x}. Tengo disponibles: ${sem.slice().reverse().join(', ')}.`); return; } w = x; }
  const t = escribiendo();
  try {
    const D = await cargarDesglose(w); const pdf = await buildDesglose(D); t.remove();
    const box = el('div', 'msg-acc');
    box.append(el('div', null, `Aquí está tu desglose de la semana ${w}${periodo(w) ? ' (' + periodo(w) + ')' : ''}. Neto: ${money(D.tot[2])}.`));
    const b = el('button', 'btn-pri sm'); b.type = 'button'; b.innerHTML = ICON.dl + '<span>Descargar PDF</span>';
    b.onclick = () => guardarPDF(pdf, `Desglose_nomina_s${w}_${corto(d.socio)}.pdf`);
    box.append(b); bot(box);
  } catch (e) { t.remove(); bot('No pude abrir tu desglose. Revisa tu conexión a internet.'); }
}
async function iniciarPrestamo() {
  let d; try { d = await refresh(); } catch (e) { bot('No pude cargar tu información. Revisa tu conexión a internet.'); return; }
  const max = Math.floor((d.saldo || 0) * 0.8 * 100) / 100;
  if (d.fondo === false || !(max > 0)) { bot('Por ahora no tienes saldo suficiente en el fondo de ahorro para solicitar un préstamo.'); return; }
  loan = { max, d };
  bot(`Puedes solicitar hasta ${money(max)}, que es el 80% de tu saldo de ${money(d.saldo)}. ¿Qué cantidad necesitas?`);
  chatStage = 'loan'; chips([`Máximo ${money(max)}`, 'Cancelar']);
  $('#mensaje').inputMode = 'decimal';
}
async function pasoPrestamo(text, q) {
  if (/cancel|no quiero|olvida/.test(q)) { loan = null; chatStage = 'chat'; $('#mensaje').inputMode = 'text'; bot('Listo, cancelé la solicitud.'); chips(baseChips()); return; }
  if (chatStage === 'loan') {
    const m = /maximo/.test(q) ? loan.max : Math.round(num(text) * 100) / 100;
    if (!(m > 0)) { bot('Escribe la cantidad con números, por ejemplo 5000.'); return; }
    if (m > loan.max) { bot(`La cantidad no puede pasar de ${money(loan.max)}. Escribe otra cantidad.`); return; }
    loan.monto = m; chatStage = 'loanConfirm'; $('#mensaje').inputMode = 'text';
    bot(`Voy a preparar tu oficio de solicitud de préstamo por ${cantidadConLetra(m)} con fecha de hoy, ${fechaLarga()}. ¿Lo genero?`);
    chips(['Generar oficio', 'Cancelar']); return;
  }
  if (!/(si|genera|ok|va|claro)/.test(q)) { bot('Toca "Generar oficio" o "Cancelar".'); return; }
  chatStage = 'chat'; chips([]);
  const d = loan.d, nombre = nombreCompleto(d), nomina = d.socio, fecha = fechaLarga(), monto = loan.monto;
  const t = escribiendo();
  let bytes = null; try { bytes = await buildLetter({ nombre, nomina, monto, fecha }); } catch (e) { bytes = null; }
  t.remove(); loan = null;
  const texto = `Solicitud de préstamo del Fondo de Ahorro\nNombre: ${nombre}\nIBM: ${nomina}\nCantidad: ${cantidadConLetra(monto)}\nFecha: ${fecha}`;
  const box = el('div', 'msg-acc');
  if (!bytes) {
    box.append(el('div', null, 'No pude generar el oficio en este teléfono. Envía tu solicitud por WhatsApp al Secretario de Relaciones en turno y él te prepara el oficio.'));
    const link = waLink(texto); if (link) { const a = el('a', 'btn-wa sm'); a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.innerHTML = ICON.wa + '<span>Enviar por WhatsApp</span>'; box.append(a); }
    bot(box); chips(baseChips()); return;
  }
  const fname = `Oficio_prestamo_${corto(nomina)}.pdf`;
  box.append(el('div', null, 'Tu oficio está listo. Envíalo al Secretario de Relaciones en turno para su trámite.'));
  if (waNumber) {
    const s = el('button', 'btn-wa sm'); s.type = 'button'; s.innerHTML = ICON.wa + '<span>Enviar al Secretario de Relaciones</span>';
    s.onclick = () => enviarPDF(bytes, fname, texto); box.append(s);
  }
  const dl = el('button', 'btn-sec sm'); dl.type = 'button'; dl.innerHTML = ICON.dl + '<span>Descargar oficio</span>';
  dl.onclick = () => guardarPDF(bytes, fname); box.append(dl);
  bot(box); chips(baseChips());
}
