<style>
/* Layout: one-screen chat — black union-crest header with the CTM tricolor band, scrolling conversation, composer pinned to the bottom. Owner gets an admin view in place of the chat. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#12161D; --muted:#5A6472; --line:#D7DDE6;
  --head:#0A0A0B; --head-ink:#FFFFFF; --brand:#0A63BF; --brand-ink:#FFFFFF; --brand-soft:#DCE8F6; --gold:#F2D513;
  --chip:#0A63BF; --pos:#0B7A3B; --neg:#C2232D; --me:#D61F2B; --me-ink:#FFFFFF;
  --t-green:#0E7A3A; --t-white:#FFFFFF; --t-red:#E3202C;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151A21; --ink:#E6EBF2; --muted:#9AA5B3; --line:#28303B;
  --head:#000000; --head-ink:#FFFFFF; --brand:#0C5AAE; --brand-ink:#FFFFFF; --brand-soft:#16273D; --gold:#F2D513;
  --chip:#5AA2F0; --pos:#45C47E; --neg:#F0646C; --me:#D8303B; --me-ink:#FFFFFF;
  --t-green:#1E8E4A; --t-white:#E9EDF2; --t-red:#E3333E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A21; --ink:#E6EBF2; --muted:#9AA5B3; --line:#28303B;
  --head:#000000; --head-ink:#FFFFFF; --brand:#0C5AAE; --brand-ink:#FFFFFF; --brand-soft:#16273D; --gold:#F2D513;
  --chip:#5AA2F0; --pos:#45C47E; --neg:#F0646C; --me:#D8303B; --me-ink:#FFFFFF;
  --t-green:#1E8E4A; --t-white:#E9EDF2; --t-red:#E3333E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:680px;margin:0 auto}
.top{background:var(--head);color:var(--head-ink)}
.band{display:grid;grid-template-columns:1fr 1fr 1fr;height:5px}.band i{display:block}.band i:nth-child(1){background:var(--t-green)}.band i:nth-child(2){background:var(--t-white)}.band i:nth-child(3){background:var(--t-red)}
.id{display:flex;align-items:center;gap:12px;min-width:0}
.crest{height:58px;width:auto;flex:none;display:block}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.ghost{background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;opacity:.9;white-space:nowrap}
.ghost:hover{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.chat{overflow:hidden;min-height:0}
.log{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex}
.row.me{justify-content:flex-end}
.bubble{max-width:min(86%,460px);padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.row.bot .bubble{border-bottom-left-radius:6px}
.row.me .bubble{background:var(--me);color:var(--me-ink);border-color:transparent;border-bottom-right-radius:6px}
.row.wide .bubble{max-width:min(94%,480px);width:100%;padding:0;overflow:hidden}
.dots{display:inline-flex;gap:4px;padding:3px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}

/* Passbook card */
.pb{display:grid;gap:4px;padding:16px 16px 14px;background:var(--brand);color:var(--brand-ink);position:relative}
.pb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 16px);opacity:.8}
.pb .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.pb .amt{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.pb .meta{font-size:13px;opacity:.85}
.delta{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--ink);margin-top:4px;justify-self:start}
.card-body{padding:12px 16px 14px;display:grid;gap:10px}
.card-h{font-weight:700;font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.list{display:grid}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;align-items:baseline}
.li:first-child{border-top:0}
.li .l{min-width:0}
.li .r{white-space:nowrap;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
svg.spark{width:100%;height:auto;display:block}

.composer{border-top:1px solid var(--line);background:var(--surface);display:grid;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips:empty{display:none}
.chip{flex:none;border:1px solid var(--chip);color:var(--chip);background:transparent;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip:active{background:var(--brand-soft)}
form.send{display:flex;gap:8px}
.inp{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:0 18px;background:var(--me);color:var(--me-ink);cursor:pointer;min-height:42px}
.btn:disabled{opacity:.5;cursor:default}

/* Admin */
.admin{overflow-y:auto;min-height:0;padding-block:18px 28px;display:grid;gap:18px;align-content:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{font:inherit;font-size:15px;width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.num{text-align:right;white-space:nowrap}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
a.btn.dl{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;justify-self:start}
button.btn.wa,a.btn.wa{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--t-green);color:#fff;justify-self:start}
.pin{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;cursor:pointer}
.empty{color:var(--muted);font-size:14px}
.edit{display:grid;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
</style>

</head>

<script>
/*
  Datos (db del artifact):
   - priv/<socio>       solo el dueño: {socio,nombre,pin,saldo,actualizado,historial:[{f,s}],movs:[{f,t:'A'|'R',m,c}]}
   - cuentas/<id>       lectura para todos, cifrado: id = sha256("fondo-id:v1:"+socio).hex[0..40]
                        cuerpo {v:1,s,i,c} = AES-GCM-256, llave PBKDF2-SHA256(socio+":"+pin, salt, 210000 it)
                        contenido = priv sin el pin
   - meta/fondo         {nombre, actualizado}
*/
const ITER = 210000;
const normPin = s => String(s || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
const $ = s => document.querySelector(s);
const log = $('#log'), chips = $('#chips'), msg = $('#msg'), form = $('#form');
const te = new TextEncoder(), td = new TextDecoder();
const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
const pdate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fdate = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? pdate(s).toLocaleDateString('es-MX', o) : '—';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// Número corto (el que usan los trabajadores) ↔ número de nómina: 8 ↔ 10008, 1003 ↔ 11003, 5001 ↔ 15001
const normSocio = s => { const v = String(s || '').trim().replace(/\s+/g, '').toUpperCase(); return /^\d{1,4}$/.test(v) ? '1' + v.padStart(4, '0') : v; };
const corto = s => /^1\d{4}$/.test(String(s)) ? (String(s).slice(1).replace(/^0+/, '') || '0') : String(s);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function cuentaId(socio) { return hex(await crypto.subtle.digest('SHA-256', te.encode('fondo-id:v1:' + normSocio(socio)))).slice(0, 40); }
async function deriveKey(socio, pin, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(normSocio(socio) + ':' + pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(socio, pin, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(socio, pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct)) };
}
async function unseal(socio, pin, d) {
  const key = await deriveKey(socio, pin, unb64(d.s), d.n || 210000);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.i) }, key, unb64(d.c));
  unseal.key = key;
  return JSON.parse(td.decode(pt));
}

let DATA = null, ready = false;
let stage = 'socio', pendSocio = '', session = null, fails = 0, lockUntil = 0;

/* ---------- Chat ---------- */
function add(who, content, wide) {
  const row = el('div', 'row ' + who + (wide ? ' wide' : ''));
  const b = el('div', 'bubble');
  if (typeof content === 'string') b.textContent = content; else b.append(content);
  row.append(b); log.append(row);
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  return row;
}
const bot = (c, wide) => add('bot', c, wide);
function typing() { const d = el('span', 'dots'); d.append(el('i'), el('i'), el('i')); return bot(d); }
const wait = ms => new Promise(r => setTimeout(r, ms));

function setChips(list) {
  chips.replaceChildren(...list.map(t => { const b = el('button', 'chip', t); b.type = 'button'; b.onclick = () => submit(t); return b; }));
}
function setMode(m) {
  stage = m;
  if (m === 'pin') { msg.type = 'password'; msg.inputMode = 'numeric'; msg.placeholder = 'PIN de 4 dígitos'; msg.maxLength = 4; }
  else { msg.type = 'text'; msg.removeAttribute('maxlength'); msg.inputMode = m === 'socio' ? 'numeric' : m === 'loan' ? 'decimal' : 'text'; msg.placeholder = m === 'socio' ? 'Número de empleado' : m === 'loan' ? 'Cantidad, por ejemplo 5000' : 'Escribe un mensaje'; }
  msg.value = '';
}

function passbook(d) {
  const w = el('div');
  const pb = el('div', 'pb');
  const lastP = (d.historial || []).slice(-1)[0];
  pb.append(el('div', 'lbl', 'Saldo acumulado'), el('div', 'amt', money(d.saldo)),
    el('div', 'meta', `Al ${fdate(d.actualizado)}${lastP && lastP.p ? ' · semana ' + lastP.p : ''} · Empleado ${corto(d.socio)}`));
  const tr = round2((d.movs || []).reduce((a, x) => a + (x.tr || 0), 0)), pa = round2((d.movs || []).reduce((a, x) => a + (x.pa || 0), 0));
  if (tr || pa) pb.append(el('div', 'meta', `Tu aportación ${money(tr)} · Aportación de la empresa ${money(pa)}`));
  const h = d.historial || [];

function spark(h) {
  const pts = h.slice(-12), W = 320, H = 110, pl = 4, pr = 4, pt = 14, pb = 20;
  const vals = pts.map(p => p.s), mx = Math.max(...vals), mn = Math.min(...vals);
  const lo = mn === mx ? mn - 1 : mn - (mx - mn) * 0.1, hi = mn === mx ? mx + 1 : mx + (mx - mn) * 0.1;
  const x = i => pl + (pts.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.s).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H - pb} ${line} ${x(pts.length - 1)},${H - pb}`;
  const last = pts.length - 1;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'spark'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `Saldo de las últimas ${pts.length} semanas`);
  svg.innerHTML =
    `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)" stroke-width="1"/>` +
    `<polygon points="${area}" fill="var(--brand-soft)"/>` +
    `<polyline points="${line}" fill="none" stroke="var(--chip)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${x(last)}" cy="${y(pts[last].s)}" r="4" fill="var(--gold)"/>` +
    `<text x="${pl}" y="${H - 5}" font-size="10" fill="var(--muted)">${fdate(pts[0].f, { day: 'numeric', month: 'short' })}</text>` +
    `<text x="${W - pr}" y="${H - 5}" font-size="10" fill="var(--muted)" text-anchor="end">${fdate(pts[last].f, { day: 'numeric', month: 'short' })}</text>`;
  return svg;
}

function enLetras(n) {
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const dos = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? ' y ' + U[x % 10] : '');
  const tres = x => x === 100 ? 'cien' : [C[Math.floor(x / 100)], dos(x % 100)].filter(Boolean).join(' ');
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  if (n === 0) return 'cero';
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, out = [];
  if (mill) out.push(mill === 1 ? 'un millón' : apoc(tres(mill)) + ' millones');

  if (r) out.push(tres(r));
  return apoc(out.join(' '));
}

async function buildLetter({ nombre, nomina, monto, fecha }) {
  await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const bytes = await (await fetch('plantilla_prestamo.pdf')).arrayBuffer();
  const doc = await PDFDocument.load(bytes);

  const R = await doc.embedFont(StandardFonts.Helvetica), B = await doc.embedFont(StandardFonts.HelveticaBold);
  const ink = rgb(0.07, 0.07, 0.07);
  const segs = [[R, 'Por medio de la presente, solicitamos formalmente se autorice al '], [B, `C. ${nombre}`], [R, ' con '], [B, `IBM ${nomina}`],
    [R, ', un préstamo proveniente del Fondo de Ahorro por la cantidad de '], [B, cantidadConLetra(monto)], [R, '.']];
  // palabras formadas por tramos de distinta fuente
  const words = []; let cur = [];
  for (const [f, t] of segs) {
    t.split(/( )/).forEach(p => {
      if (p === ' ') { if (cur.length) words.push(cur); cur = []; }
      else if (p) cur.push([f, p]);
    });
  }
  if (cur.length) words.push(cur);
  const X0 = 177.4, W = 405.1, Y0 = 580.9;
  let size = 10, lines;
  for (; size >= 8.2; size -= 0.3) {
    const ww = w => w.reduce((a, [f, t]) => a + f.widthOfTextAtSize(t, size), 0), sp = R.widthOfTextAtSize(' ', size);
    lines = []; let line = [], lw = 0;
    for (const w of words) {
      const wi = ww(w);
      if (line.length && lw + sp + wi > W) { lines.push(line); line = []; lw = 0; }
      lw += (line.length ? sp : 0) + wi; line.push({ w, wi });
    }
    if (line.length) lines.push(line);
    if (lines.length <= 3) break;
  }
  const lh = size * 1.225, sp = R.widthOfTextAtSize(' ', size);
  lines.forEach((line, li) => {
    const total = line.reduce((a, x) => a + x.wi, 0);
    const gap = li < lines.length - 1 && line.length > 1 ? (W - total) / (line.length - 1) : sp;
    let x = X0; const y = Y0 - li * lh;
    line.forEach(({ w, wi }) => {
      let xx = x;
      w.forEach(([f, t]) => { page.drawText(t, { x: xx, y, size, font: f, color: ink }); xx += f.widthOfTextAtSize(t, size); });
      x += wi + gap;
    });
  });
  const linea = `Tamazula De Gordiano, a ${fecha}`, fw = B.widthOfTextAtSize(linea, 10);
  page.drawText(linea, { x: 386.2 - fw / 2, y: 251.3, size: 10, font: B, color: ink });
  doc.setTitle(`Solicitud de préstamo - ${nombre}`);
  return doc.save();
}

async function submit(raw) {
  const text = String(raw || '').trim();
  if (!text) return;
  if (stage === 'pin') add('me', '•'.repeat(Math.min(text.length, 6))); else add('me', text);
  msg.value = '';

  if (!ready) { bot('Un momento, estoy conectando…'); return; }
  if (!DATA) { bot('No pude cargar la información. Revisa tu conexión a internet y vuelve a abrir la página.'); return; }

  if (stage === 'socio') {
    pendSocio = normSocio(text);
    bot('Gracias. Ahora escribe tu PIN de 4 dígitos.');
    setMode('pin');
    return;
  }

  if (stage === 'pin') {
    if (Date.now() < lockUntil) { bot(`Demasiados intentos. Espera ${Math.ceil((lockUntil - Date.now()) / 1000)} segundos y escribe de nuevo tu número de empleado.`); setMode('socio'); return; }
    const pin = normPin(text);
    const t = typing();
    try {
      const id = await cuentaId(pendSocio);
      const blob = DATA.cuentas[id];
      if (!blob) throw new Error('no');
      const data = await unseal(pendSocio, pin, blob);
      session = { socio: pendSocio, pin, id, data, key: unseal.key, salt: blob.s };
      fails = 0; t.remove();
      const first = data.orden === 'nomina' ? '' : titulo((data.nombre || '').split(' ')[0]);
      if (data.fondo === false) {
        bot(`¡Hola${first ? ', ' + first : ''}! Entraste correctamente.`);
        bot('Por ahora no tienes saldo registrado en el fondo de ahorro. ¿En qué te puedo ayudar?');
        setMode('chat'); setChips(['Cerrar sesión']);
      } else {
        bot(`¡Hola${first ? ', ' + first : ''}! Este es tu saldo:`);
        bot(passbook(data), true);
        bot('¿Qué más quieres consultar? Puedes tocar una opción o escribirme.');
        setMode('chat'); setChips(MENU);
      }
    } catch (e) {
      t.remove();
      fails++;
      if (fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; }
      bot('El número de empleado o el PIN no coinciden. Escribe de nuevo tu número de empleado.');
      setMode('socio');
    }
    return;
  }

  if (stage === 'loan' || stage === 'loanConfirm') { await loanStep(text); return; }

  // Conversación con sesión iniciada
  const q = text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (/(desglose|nomina|recibo|percepcion|deduccion)/.test(q)) { await pedirDesglose(q); return; }
  if (/(prestamo|credito|adelanto)/.test(q)) { await startLoan(); return; }
  if (/(cerrar|salir|adios|logout)/.test(q)) { logout(); return; }
  if (/^(hola|buen|que tal|hey)/.test(q) && !/(saldo|hist|mov|aport|retir)/.test(q)) { bot('¡Hola! ¿Quieres ver tu saldo, tu historial o tus movimientos?'); return; }
  const t = typing();
  let d;
  try { d = await refresh(); } catch (e) { t.remove(); bot('No pude cargar tu información. Revisa tu conexión e inténtalo de nuevo.'); return; }
  await wait(250); t.remove();
  if (d.fondo === false) { bot('No tienes saldo registrado en el fondo de ahorro. Si crees que es un error, comunícate con la Secretaría de Relaciones.'); return; }
  if (/(hist|semana|evolucion|grafic)/.test(q)) bot(historyCard(d), true);
  else if (/aport|deposit|abono/.test(q)) bot(movsCard(d, 'A'), true);
  else if (/retir/.test(q)) bot(movsCard(d, 'R'), true);
  else if (/mov|transac/.test(q)) bot(movsCard(d), true);
  else if (/(saldo|cuanto|tengo|dinero|fondo|total)/.test(q)) bot(passbook(d), true);
  else bot('Puedo mostrarte tu saldo actual, tu historial semanal o tus aportaciones y retiros. Toca una opción de abajo.');
}
