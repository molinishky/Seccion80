<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sección 80">
<title>Sección 80</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0068B8;--azul-h:#00579A;--azul-os:#003E6E;--azul-cl:#EEF5FC;--tx:#1F2430;--mu:#5B6575;--mu2:#8A94A3;
  --ln:#D3DAE3;--ln2:#E1E6ED;--ln3:#E6E9EE;--rojo:#E3202B;--amar:#FFE600;--verde:#1E8A3C;--verde-cl:#E9F5EC;--neg:#B4232C;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --flota:0 10px 28px rgba(0,58,110,.10),0 0 0 .5px rgba(0,58,110,.06);
  --vidrio-bg:rgba(255,255,255,.55);
  --navh:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior-y:contain;background:#FFFFFF;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(255,214,0,.8);outline-offset:2px;border-radius:12px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;isolation:isolate}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--ln3)}}

/* Fondo decorativo: caña y retrato */
.deco{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:380px;z-index:-1;pointer-events:none;overflow:hidden}
.deco svg,.deco img{position:absolute;bottom:0;display:block}
.deco .c1{left:-6px;opacity:.22}.deco .c2{left:78px;opacity:.16}
.deco img{right:-24px;height:340px;width:auto;opacity:.22}
body.en-chat .deco img{opacity:.12}

/* Franjas */
.franjas{display:flex;gap:5px}
.franjas i{display:block;width:22px;height:5px;border-radius:3px}
.franjas i:nth-child(1){background:var(--rojo)}.franjas i:nth-child(2){background:var(--amar)}.franjas i:nth-child(3){background:var(--azul)}.franjas i:nth-child(4){background:var(--verde)}
.franjas.g i{width:28px;height:6px}.franjas.g{gap:6px}

.scr{padding-top:var(--sat);padding-bottom:calc(var(--navh) + var(--sab) + 12px);min-height:100dvh}
#s-login{padding-bottom:calc(24px + var(--sab))}

/* Encabezados */
.top{display:flex;align-items:center;gap:8px;padding:14px 12px 0;min-height:68px}
.top h1{margin:0;flex:1;font-size:20px;font-weight:700;min-width:0}
.top .tt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.top .tt h1{flex:none}
.top .tt span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.top .tt span::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--verde)}
.top img{height:44px;width:auto;display:block;margin-right:8px}
.volver,.ico-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--azul);cursor:pointer}
.volver:hover,.ico-btn:hover{background:#EEF4FB}
.top+.franjas{padding:10px 20px 0}
.pad{padding:20px 20px 0}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;padding:calc(64px + var(--sat)) 28px 0;min-height:100dvh}
.login-escudo{width:168px;height:auto;display:block}
.login .franjas{margin-top:28px}
.form{width:100%;display:flex;flex-direction:column;gap:18px;margin-top:40px}
.campo label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.caja{display:flex;align-items:center;gap:12px;height:56px;padding:0 6px 0 16px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.caja:focus-within{border-color:var(--azul);box-shadow:0 0 0 3px rgba(255,214,0,.55)}
.caja svg.ic{flex:none;color:var(--azul)}
.caja input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:17px;outline:none}
.caja input::placeholder{color:var(--mu2)}
#pin{letter-spacing:.2em}
#ojo .c{display:none}#ojo.on .c{display:block}#ojo.on .o{display:none}
#ojo{color:var(--mu)}
.hola{min-height:20px;font-size:14.5px;color:var(--azul);font-weight:600;margin-top:-6px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:-4px;font-size:15px;cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--azul);cursor:pointer}
.msg-err{min-height:20px;font-size:14px;color:var(--neg);text-align:center}
.btn-pri,.btn-sec,.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:14px;border:0;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;width:100%;transition:background .15s,transform .05s}
.btn-pri{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(0,104,184,.22)}.btn-pri:hover{background:var(--azul-h)}
#entrar{height:58px;font-size:18px}
.btn-pri:active,.btn-sec:active,.btn-wa:active{transform:translateY(1px)}
.btn-pri:disabled{opacity:.6;cursor:default}
.btn-sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}.btn-sec:hover{background:var(--azul-cl)}
.btn-wa{background:var(--verde);color:#fff;box-shadow:0 6px 16px rgba(30,138,60,.2)}.btn-wa:hover{background:#18742F}
.sm{height:46px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;cursor:pointer;padding:12px;margin-top:4px}
.tri{display:flex;width:120px;height:4px;border-radius:2px;overflow:hidden;margin:auto 0 8px}
.tri i{flex:1}.tri i:nth-child(1){background:var(--verde)}.tri i:nth-child(2){background:var(--ln3)}.tri i:nth-child(3){background:var(--rojo)}
.pie{padding:18px 0 14px;font-size:12.5px;color:var(--mu);text-align:center}

/* Inicio */
.home-top{position:relative;display:flex;align-items:center;justify-content:center;padding:28px 20px 0}
.home-top img{height:76px;width:auto;display:block}
.home-top #salir{position:absolute;right:12px;top:22px;color:var(--mu)}
.home-top+.franjas{justify-content:center;margin-top:12px}
.saludo{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:var(--azul-cl);box-shadow:var(--flota)}
.avatar{position:relative;flex:none;width:60px;height:60px;border-radius:50%;background:var(--azul);display:grid;place-items:center;border:0;padding:0;cursor:pointer}
.avatar img{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--azul)}
.avatar .cam{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--azul);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,58,110,.25)}
.hoja-fondo{position:fixed;inset:0;z-index:40;background:rgba(15,25,40,.35);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:sube .22s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
.hoja .agarre{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.hoja h3{font-size:16px;text-align:center;margin-bottom:4px}
.hoja p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:12px}
.hoja .btns{display:flex;flex-direction:column;gap:10px}
.saludo .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.saludo small{font-size:15px}
.saludo h2{font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.saludo p{font-size:13px;color:var(--mu);margin-top:2px}
.tarjetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border:1.5px solid var(--ln2);border-radius:18px;background:#fff;text-align:left;cursor:pointer;min-height:168px;box-shadow:var(--flota);transition:border-color .15s,box-shadow .15s,transform .15s}
.tarjeta:hover{border-color:var(--azul);box-shadow:0 12px 28px rgba(0,104,184,.16)}
.tarjeta:active{transform:translateY(1px)}
.tarjeta .fila1{display:flex;align-items:flex-start;justify-content:space-between}
.circ{width:56px;height:56px;border-radius:50%;background:var(--azul);display:grid;place-items:center;color:#fff}
.circ.v{background:var(--verde)}
.tarjeta .ch{color:var(--mu2);margin-top:4px}
.tarjeta b{font-size:17px;font-weight:700;line-height:1.25}
.tarjeta span.sub{font-size:13px;color:var(--mu);line-height:1.4}

/* Fondo de ahorro */
.saldo{display:flex;flex-direction:column;gap:10px;background:var(--azul);color:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 10px 24px rgba(0,104,184,.22)}
.saldo-lbl{font-size:16px;font-weight:800;color:#FFFFFF}
.saldo-amt{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.saldo-meta{font-size:15px;color:#E8F1FB;line-height:1.4}
.saldo-pill{align-self:flex-start;margin-top:4px;padding:8px 14px;border-radius:999px;background:var(--azul-os);font-size:14px;font-weight:600}
.saldo.vacio{background:#fff;color:var(--tx);border:1.5px solid var(--ln2);box-shadow:var(--flota)}
.saldo.vacio .saldo-lbl{color:var(--mu)}.saldo.vacio .saldo-meta{color:var(--mu)}
.saldo-sin{font-size:20px;font-weight:700}
.panel{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;padding:16px;box-shadow:var(--flota)}
.panel h2{font-size:15px;font-weight:700;margin-bottom:6px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln3)}
.fila:first-child{border-top:0}
.fila-l{display:flex;flex-direction:column;gap:2px}
.fila-t{font-size:14.5px;font-weight:600}
.fila-s{font-size:13px}.pos{color:var(--verde)}.neg{color:var(--neg)}
.fila-r{font-weight:700;font-variant-numeric:tabular-nums}
.cargando,.aviso{padding:28px 16px;text-align:center;color:var(--mu);font-size:15px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;box-shadow:var(--flota)}
.cargando::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--ln2);border-top-color:var(--azul);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Vidrio */
.vidrio{border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.65),rgba(255,255,255,.4));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.14),0 6px 20px rgba(0,58,110,.10)}

/* Desglose */
.sel-lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.sel{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 16px;border-radius:18px;transition:box-shadow .15s}
.sel:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 6px 20px rgba(0,58,110,.10)}
.sel svg{flex:none}
.sel select{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;outline:none}
.sel .flecha{position:absolute;right:14px;pointer-events:none}
.recibo{margin-top:16px;background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;box-shadow:var(--flota)}
.recibo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:linear-gradient(180deg,rgba(238,245,252,.85),rgba(238,245,252,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -.5px 0 rgba(0,58,110,.10)}
.recibo-h b{font-size:15px}
.recibo-h span{font-size:12px;color:var(--mu)}
#recibo .cargando,#recibo .aviso{border:0;border-radius:0;box-shadow:none}
.rec-per{padding:10px 16px;font-size:13px;color:var(--mu);border-bottom:1px solid var(--ln3)}
.rec-lista{padding:0 16px}
.rec-fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln3)}
.rec-fila:first-child{border-top:0}
.rec-l{display:flex;flex-direction:column;min-width:0}
.rec-c{font-size:14px;font-weight:600}
.rec-d{font-size:12.5px;color:var(--mu)}
.rec-m{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-tot{border-top:1px solid var(--ln2);padding:12px 16px;background:#FAFBFD}
.rec-tl{display:flex;justify-content:space-between;font-size:14.5px;padding:4px 0;font-variant-numeric:tabular-nums}
.rec-tl.neto{font-size:17px;font-weight:800;color:var(--azul);border-top:1px solid var(--ln2);margin-top:6px;padding-top:10px}
#descargar{margin-top:16px}

/* Préstamos */
.pre{--ac:var(--azul);--ac-cl:var(--azul-cl);background:#fff;border:1.5px solid var(--ln2);border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:var(--flota)}
.pre.v{--ac:var(--verde);--ac-cl:var(--verde-cl)}
.pre-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--ac-cl)}
.pre-h b{font-size:16px;flex:1;color:var(--ac)}
.pre-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--ac);border:1px solid var(--ac);white-space:nowrap}
.pre-m{padding:18px 16px 16px}
.pre-lbl{display:inline-block;font-size:14px;font-weight:800;color:#FFFFFF;background:var(--ac);padding:4px 12px;border-radius:999px}
.pre-amt{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ac)}
.pre-meta{font-size:13.5px;color:var(--mu);margin-top:4px}
.pre-ok{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--ac-cl);color:var(--ac);font-size:14.5px;font-weight:600}

/* Chat */
#s-chat{display:flex;flex-direction:column;height:100dvh;padding-bottom:0}
#s-chat[hidden]{display:none!important}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px}
.hoy{align-self:center;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.45);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 .5px rgba(0,58,110,.12),0 4px 12px rgba(0,58,110,.08);font-size:12px;font-weight:600;color:var(--mu)}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.msg.yo{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--azul-cl);display:grid;place-items:center;flex:none}
.msg-av img{height:22px;width:auto}
.msg-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg-b{background:var(--azul-cl);border-radius:18px 18px 18px 6px;padding:11px 14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.yo .msg-b{background:var(--azul);color:#fff;border-radius:18px 18px 6px 18px}
.msg-h{font-size:11px;color:var(--mu);padding:0 4px}
.yo .msg-h{text-align:right}
.msg-acc{display:flex;flex-direction:column;gap:10px;white-space:normal}
.msg:has(.ley){max-width:96%}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#A0A8B4;animation:pt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chat-pie{padding:6px 16px calc(var(--navh) + var(--sab) + 6px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,rgba(238,245,252,.9),rgba(238,245,252,.6));box-shadow:0 0 0 .5px rgba(0,58,110,.16),0 4px 12px rgba(0,58,110,.08);color:var(--azul);font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{box-shadow:0 0 0 1px var(--azul),0 4px 12px rgba(0,58,110,.10)}
.chat-form{display:flex;align-items:center;gap:10px}
.chat-form .entrada{flex:1;display:flex;align-items:center;height:48px;padding:0 16px;border-radius:24px}
.chat-form .entrada:focus-within{box-shadow:0 0 0 3px rgba(255,214,0,.55),0 6px 20px rgba(0,58,110,.10)}
.chat-form input{flex:1;min-width:0;height:100%;border:0;background:transparent;font-size:16px;outline:none}
.chat-form input::placeholder{color:var(--mu2)}
.enviar{width:48px;height:48px;border-radius:50%;border:0;background:var(--azul);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.enviar:hover{background:var(--azul-h)}

/* Consultas de ley */
.ley{border:1px solid var(--ln2);border-radius:12px;padding:10px 12px;background:#fff}
.ley-t{font-weight:700;font-size:14px;color:var(--azul)}
.ley-h{font-size:12px;color:var(--mu);margin-top:2px}
.ley-x{font-size:14px;line-height:1.5;margin-top:6px;white-space:pre-wrap}
.ley-mas{margin-top:6px;background:none;border:0;color:var(--azul);font-weight:600;font-size:13.5px;padding:6px 0;cursor:pointer;text-decoration:underline}
.ley-sub{font-size:13px;color:var(--mu);font-weight:600}
.ley-ops{display:flex;flex-wrap:wrap;gap:6px}
.ley-ops .chip{height:auto;min-height:34px;padding:6px 12px;font-size:13px;text-align:left}
.ley-nota{font-size:12.5px;color:var(--mu);font-style:italic}

/* Barra flotante de vidrio */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:calc(100% - 28px);max-width:452px;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 0 0 .5px rgba(0,58,110,.10),0 12px 36px rgba(0,58,110,.18)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:8px 2px 6px;border:0;background:none;border-radius:14px;min-height:58px;min-width:0;width:100%;cursor:pointer;color:var(--mu)}
.tab:hover{background:rgba(243,247,252,.8)}
.tab svg{width:24px;height:24px;flex:none}
.tab .tl{display:flex;align-items:flex-start;justify-content:center;height:24px;width:100%;font-size:10.5px;font-weight:500;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.tab .bar{display:block;width:36px;height:3px;border-radius:2px;background:transparent}
.tab.on{color:var(--azul)}
.tab.on .tl{font-weight:700}
.tab.on .bar{background:var(--azul)}

/* Transiciones y gestos */
@keyframes entraD{from{transform:translateX(28%);opacity:.3}to{transform:none;opacity:1}}
@keyframes entraI{from{transform:translateX(-28%);opacity:.3}to{transform:none;opacity:1}}
.entra-d{animation:entraD .26s cubic-bezier(.2,.8,.2,1)}
.entra-i{animation:entraI .26s cubic-bezier(.2,.8,.2,1)}
.scr{will-change:transform}
.app{overflow-x:clip;max-width:min(480px,100vw)}
#ptr{position:fixed;top:calc(var(--sat) + 0px);left:50%;transform:translate(-50%,-40px);z-index:15;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,58,110,.18);display:grid;place-items:center;color:var(--mu);transition:transform .2s}
#ptr.listo{color:var(--azul)}
#ptr.gira svg{animation:gira .7s linear infinite}
/* Aviso de actualización del APK */
.actualizar{min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(56px + var(--sat)) 28px calc(28px + var(--sab));gap:16px}
.actualizar img{width:120px;height:auto}
.actualizar h1{font-size:24px;font-weight:800;margin-top:8px}
.actualizar p{font-size:15.5px;color:var(--mu);line-height:1.5}
.pasos{text-align:left;align-self:stretch;background:var(--azul-cl);border-radius:18px;padding:16px 16px 16px 36px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45;box-shadow:var(--flota)}
.actualizar .btn-pri{margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--sab) + 18px);background:var(--tx);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
#splash{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:30}
#splash img{height:120px;animation:lat 1.4s ease-in-out infinite}
@keyframes lat{50%{opacity:.6;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:350px){.tarjeta{min-height:150px;padding:14px}.tarjeta b{font-size:15.5px}.circ{width:48px;height:48px}}
</style>

<script>
const ITER = 210000;
const normPin = s => String(s || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
const $ = s => document.querySelector(s);

const te = new TextEncoder(), td = new TextDecoder();
const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
const pdate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fdate = (s, o = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? pdate(s).toLocaleDateString('es-MX', o) : '—';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// Número corto (el que usan los trabajadores) ↔ número de nómina: 8 ↔ 10008, 1003 ↔ 11003, 5001 ↔ 15001
const normSocio = s => { const v = String(s || '').trim().replace(/\s+/g, '').toUpperCase(); return /^\d{1,4}$/.test(v) ? '1' + v.padStart(4, '0') : v; };
const corto = s => /^1\d{4}$/.test(String(s)) ? (String(s).slice(1).replace(/^0+/, '') || '0') : String(s);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function cuentaId(socio) { return hex(await crypto.subtle.digest('SHA-256', te.encode('fondo-id:v1:' + normSocio(socio)))).slice(0, 40); }
async function deriveKey(socio, pin, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(normSocio(socio) + ':' + pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(socio, pin, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(socio, pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct)) };
}
async function unseal(socio, pin, d) {
  const key = await deriveKey(socio, pin, unb64(d.s), d.n || 210000);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.i) }, key, unb64(d.c));
  unseal.key = key;
  return JSON.parse(td.decode(pt));
}


async function buildDesglose(D) {
  await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const doc = await PDFDocument.create();

  return (dCache[w] = JSON.parse(td.decode(plain)));

/* ================= PDF: guardar y enviar ================= */
function aB64(bytes) { let s = ''; const ch = 0x8000; for (let i = 0; i < bytes.length; i += ch) s += String.fromCharCode.apply(null, bytes.subarray(i, i + ch)); return btoa(s); }
async function guardarPDF(bytes, nombre) {
  if (ANDROID && ANDROID.guardarPdf) { ANDROID.guardarPdf(aB64(bytes), nombre); return; }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Descargando ' + nombre);
}
async function enviarPDF(bytes, nombre, texto) {
  const tel = String(waNumber || '').replace(/\D/g, ''), full = tel.length === 10 ? '52' + tel : tel;
  if (ANDROID && ANDROID.compartirPdf) { ANDROID.compartirPdf(aB64(bytes), nombre, texto, full); return; }
  try {
    const f = new File([bytes], nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: texto, title: nombre }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  await guardarPDF(bytes, nombre);
  const link = waLink(texto);
  if (link) window.open(link, '_blank', 'noopener');
}
